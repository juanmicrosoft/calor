# Deploy Next.js static site to GitHub Pages
name: Deploy Next.js to GitHub Pages

# Runs only by dispatch from main, for a release tag whose commit is on main. publish-nuget
# dispatches it after the packages are on nuget.org and the installed-tool check passed (#1582).
# It builds the tagged commit, not the dispatch ref. There is no `release: created` trigger.
# #1585 reworks this workflow further.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v0.26.0); its commit must be on main'
        required: true
        type: string
      commit:
        description: 'The commit the tag must name (publish-nuget passes the released candidate)'
        required: false
        type: string
        default: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a dispatch from any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy only from main (got $GITHUB_REF)"
          exit 1

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The wording scan is main's copy, kept outside the work tree: an older tag may predate it.
      - name: Check out the release tag (its commit must be on main)
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not a release tag"; exit 1; }
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$commit" HEAD || { echo "::error::$TAG ($commit) is not on main"; exit 1; }
          if [ -n "$EXPECTED" ] && [ "$commit" != "$EXPECTED" ]; then
            echo "::error::$TAG names $commit, not the released commit $EXPECTED"; exit 1
          fi
          cp scripts/release_checks.py "$RUNNER_TEMP/release_checks.py"
          git checkout -q --detach "$commit"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Check the site serves only self-hosted fonts (#1548)
        run: python3 scripts/check_website_fonts.py --out website/out

      # Formerly gate code G012: the built site must not claim the release evidence was
      # independently adjudicated or verified.
      - name: Scan the built site for forbidden wording
        run: python3 "$RUNNER_TEMP/release_checks.py" wording website/out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
