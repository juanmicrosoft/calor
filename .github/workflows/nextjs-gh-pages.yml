# Deploy Next.js static site to GitHub Pages
name: Deploy Next.js to GitHub Pages

# Runs only by dispatch from main, for a release tag whose commit is on main. publish-nuget
# dispatches it after the packages are on nuget.org and the installed-tool check passed, and
# passes the released commit; the tag must name exactly that commit (#1582, #1585). There is no
# `release: created` trigger: releases created with GITHUB_TOKEN raise no `release` events.
# It builds the tagged commit, not main, because main may document unreleased behavior. The site
# checks (self-hosted fonts, forbidden wording) come from main, so an older tag meets today's checks.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v0.26.0); its commit must be on main'
        required: true
        type: string
      commit:
        description: 'The commit the tag must name (publish-nuget passes the released candidate)'
        required: false
        type: string
        default: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a dispatch from any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy only from main (got $GITHUB_REF)"
          exit 1

      # Commit history only (no trees or blobs beyond main's scripts/): enough to resolve the
      # tag and check that its commit is on main.
      - name: Check out main's site checks
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve the release tag (its commit must be on main)
        id: tag
        working-directory: main
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not a release tag"; exit 1; }
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$commit" HEAD || { echo "::error::$TAG ($commit) is not on main"; exit 1; }
          if [ -n "$EXPECTED" ] && [ "$commit" != "$EXPECTED" ]; then
            echo "::error::$TAG names $commit, not the released commit $EXPECTED"; exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.commit }}
          path: release
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: release/website/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: release/website
        run: npm ci

      - name: Build
        working-directory: release/website
        run: npm run build

      - name: Check the site serves only self-hosted fonts (#1548)
        run: python3 main/scripts/check_website_fonts.py --website release/website --out release/website/out

      # The built site must not claim the release was independently adjudicated or verified.
      - name: Scan the built site for forbidden wording
        run: python3 main/scripts/release_checks.py wording release/website/out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/website/out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
