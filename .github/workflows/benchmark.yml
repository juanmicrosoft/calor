name: Benchmarks

on:
  # Release and push events run deterministic benchmarks only.
  release:
    types: [created]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      statistical_runs:
        description: 'Number of statistical runs (default 30)'
        required: false
        default: '30'
      skip_llm:
        description: 'Skip paid LLM benchmarks (default true; opting in requires separate authorization)'
        required: false
        default: 'true'
        type: boolean
      agent_refactoring:
        description: 'Run agent refactoring benchmark'
        required: false
        default: 'false'
        type: boolean
      # #1422: no input may weaken or bypass the publication gate. A method change needs a
      # merged #1407 amendment that names the new comparability key, never an override flag.
  # Run on pushes to benchmark-related files
  push:
    branches: [main]
    paths:
      - 'tests/Calor.Evaluation/**'
      - 'tests/TestData/Benchmarks/**'
      - 'tests/E2E/agent-tasks/**'
      - '.github/workflows/benchmark.yml'
      # #1422: a change to any gate input re-runs the gate (and its cleanup).
      - 'docs/plans/evidence/b1-1276/**'
      - 'docs/plans/evidence/evidence-contract-1407/**'
      - 'tests/Calor.Compiler.Tests/EvidenceContract/**'
      - 'scripts/benchmark_publication_gate.py'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # #1422: publication and stale-PR cleanup are serialized, so an older passing run cannot
    # update the publication PR after a newer refusal closed it.
    concurrency:
      group: benchmark-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # #1422: the publication gate checks provenance against origin/main and fails in a
          # shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        uses: ./.github/actions/bootstrap-z3

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # #1410: dispatch inputs reach the shell only through the environment, validated,
      # never interpolated into the script (a `$(...)` value would run before the gate).
      - name: Run static benchmarks
        env:
          RUNS: ${{ github.event.inputs.statistical_runs || '30' }}
        run: |
          set -euo pipefail
          [[ "$RUNS" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::statistical_runs must be an integer from 1 to 9999"; exit 1; }
          dotnet run --project tests/Calor.Evaluation -c Release -- run \
            --statistical \
            --runs "$RUNS" \
            --format website \
            --output website/public/data/benchmark-results.json \
            --verbose

      - name: Run statistical analysis
        if: github.event.inputs.statistical_runs != ''
        env:
          RUNS: ${{ github.event.inputs.statistical_runs || '30' }}
        run: |
          set -euo pipefail
          [[ "$RUNS" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::statistical_runs must be an integer from 1 to 9999"; exit 1; }
          dotnet run --project tests/Calor.Evaluation -c Release -- run \
            --statistical \
            --runs "$RUNS" \
            --format website \
            --output website/public/data/benchmark-results-statistical.json \
            --verbose

      # Paid calls require an explicit manual opt-in, never release/push events.
      - name: Restore LLM response cache
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.calor/llm-cache
          key: llm-cache-${{ github.run_id }}
          restore-keys: |
            llm-cache-

      - name: Run LLM Comprehension evaluation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set, skipping LLM comprehension evaluation"
            exit 0
          fi
          dotnet run --project tests/Calor.Evaluation -c Release -- run \
            --llm \
            --format json \
            --output website/public/data/llm-comprehension-results.json \
            --verbose

      - name: Run TaskCompletion benchmark (LLM)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set, skipping LLM benchmarks"
            exit 0
          fi
          dotnet run --project tests/Calor.Evaluation -c Release -- llm-tasks \
            -m tests/Calor.Evaluation/Tasks/task-manifest.json \
            --budget 5.00 \
            --output website/public/data/llm-results.json \
            --verbose

      - name: Run Safety benchmark (LLM)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            exit 0
          fi
          dotnet run --project tests/Calor.Evaluation -c Release -- safety-benchmark \
            -m tests/Calor.Evaluation/Tasks/task-manifest-safety.json \
            --budget 5.00 \
            --output website/public/data/safety-results.json \
            --verbose

      - name: Run EffectDiscipline benchmark (LLM)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            exit 0
          fi
          dotnet run --project tests/Calor.Evaluation -c Release -- effect-discipline \
            -m tests/Calor.Evaluation/Tasks/task-manifest-effects.json \
            --budget 5.00 \
            --output website/public/data/effect-discipline-results.json \
            --verbose

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Merge LLM results into benchmark-results.json
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        run: |
          node scripts/merge-llm-results.js

      - name: Generate docs/benchmarking/results.md
        run: node scripts/generate-results-md.js

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            website/public/data/benchmark-results.json
            website/public/data/benchmark-results-statistical.json
            website/public/data/llm-comprehension-results.json
            website/public/data/llm-results.json
            website/public/data/safety-results.json
            website/public/data/effect-discipline-results.json
          retention-days: 90

      # #1422: everything above is diagnostic. It is uploaded, then discarded, so no number that
      # the B1 results generator did not produce can reach the publication PR.
      - name: Keep historical benchmark files historical (#1422)
        run: |
          set -euo pipefail
          git reset --quiet --hard HEAD
          git clean -fdq

      - name: Regenerate the B1 results with the registered generator (#1422)
        id: regenerate
        run: |
          set -euo pipefail
          # B1's packet validator (seals, oracle reconciliation, known witness, recomputed statistics).
          dotnet test tests/Calor.Compiler.Tests -c Release --no-build \
            --filter "FullyQualifiedName~BenchmarkResultsTests|FullyQualifiedName~BenchmarkRegistrationTests"
          REG=docs/plans/evidence/b1-1276/registration
          RES=docs/plans/evidence/b1-1276/results
          OUT="$RUNNER_TEMP/b1-regen"
          mkdir -p "$OUT"
          for i in 1 2; do
            dotnet run --no-build --project tests/Calor.Evaluation -c Release -- pair-metrics \
              --registration "$REG" --oracle-result "$RES/oracle-run-2.json" --output "$OUT/metrics-run-$i.json"
          done
          dotnet run --no-build --project tests/Calor.Evaluation -c Release -- pair-results \
            --registration "$REG" --first-oracle-result "$RES/oracle-run-1.json" \
            --oracle-result "$RES/oracle-run-2.json" \
            --metrics "$OUT/metrics-run-1.json" "$OUT/metrics-run-2.json" --output "$OUT"

      # #1422: the refusal gate. A refusal exits nonzero here, so every later step that opens a PR
      # or pushes is skipped. No pipe sits between the gate and the step's exit status.
      - name: Refuse incomparable or non-equivalent benchmark results (#1422)
        id: methodology
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/benchmark_publication_gate.py check \
            --commit "$(git rev-parse HEAD)" \
            --regenerated "$RUNNER_TEMP/b1-regen" \
            --report "$RUNNER_TEMP/benchmark-gate-report.txt"
          {
            echo 'report<<BENCHMARK_GATE_EOF'
            cat "$RUNNER_TEMP/benchmark-gate-report.txt"
            echo 'BENCHMARK_GATE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the publication candidate and its inputs (#1422)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-publication-candidate
          path: |
            ${{ runner.temp }}/b1-regen
            ${{ runner.temp }}/benchmark-gate-report.txt
            website/public/data/benchmark-headline.json
            bench/phase0-agent-native/commit-stamp-index.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Create PR with benchmark results
        if: github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update benchmark headline"
          title: "chore: Update benchmark headline"
          body: |
            This PR publishes `website/public/data/benchmark-headline.json`, written by
            `scripts/benchmark_publication_gate.py` (#1422) from the B1 results packet
            (`docs/plans/evidence/b1-1276/results/`), and its provenance entry in
            `bench/phase0-agent-native/commit-stamp-index.json`. Nothing else changes.

            ## Gate report

            ```
            ${{ steps.methodology.outputs.report }}
            ```

            The gate refuses this PR when an included pair is not EQUIVALENT, a registered pair or
            the registration changed, the method differs without a #1407 amendment merged first,
            the regenerated packet differs, or the provenance commit is not a full SHA on main.
            Across different comparability keys no delta is reported. EQUIVALENT is not a
            correctness claim, and the headline describes this fixed corpus only.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: benchmark-results-update
          base: main
          delete-branch: true

      # #1422: last step of the job, so a failure anywhere (gate, regeneration, or publication
      # itself) must not leave an earlier publication PR mergeable. The listing is paginated and
      # checked, every close is attempted, and any failed close fails the job.
      - name: Close stale publication PRs after a refusal (#1422)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("benchmark-results")) | .number')"
          failed=0
          for pr in $prs; do
            gh pr close "$pr" --comment "Closed by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID: the #1422 publication gate refused or could not check the current results." || failed=1
          done
          exit "$failed"

  regression-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: benchmark

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: current-results

      - name: Check for regression
        run: |
          echo "Checking for benchmark regressions..."
          if [ -f "current-results/benchmark-results.json" ]; then
            echo "Benchmark results generated successfully"
            cat current-results/benchmark-results.json | head -50
          else
            echo "Warning: No benchmark results found"
          fi

  # Agent Refactoring Benchmark - compares Calor vs C# refactoring success rates
  # Uses Claude Code CLI to perform refactoring tasks and measures pass rates
  agent-refactoring-benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.agent_refactoring == 'true'
    needs: benchmark
    # #1422: this job measures and uploads only. It never commits or pushes, and a pass rate it
    # cannot read fails the job instead of being recorded as 0.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        uses: ./.github/actions/bootstrap-z3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Restore dependencies
        run: dotnet restore

      - name: Build compiler
        run: dotnet build -c Release --no-restore

      - name: Run Calor refactoring benchmark
        id: calor-benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          cd tests/E2E/agent-tasks
          chmod +x run-agent-tests.sh
          ./run-agent-tests.sh --category refactoring-benchmark --filter calor --single-run 2>&1 | tee /tmp/calor-results.txt
          # Extract pass rate; a missing figure fails the job rather than becoming 0 (#1422)
          CALOR_PASS_RATE=$(sed "s/$(printf '\033')\[[0-9;]*m//g" /tmp/calor-results.txt | grep -oE 'Pass Rate: [0-9]+' | tail -n1 | sed 's/.*: //')
          [[ "$CALOR_PASS_RATE" =~ ^[0-9]+$ ]] || { echo "::error::no Calor pass rate in the run output"; exit 1; }
          echo "calor_pass_rate=$CALOR_PASS_RATE" >> "$GITHUB_OUTPUT"

      - name: Run C# refactoring benchmark
        id: csharp-benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          cd tests/E2E/agent-tasks
          ./run-agent-tests.sh --category refactoring-benchmark --filter csharp --single-run 2>&1 | tee /tmp/csharp-results.txt
          # Extract pass rate; a missing figure fails the job rather than becoming 0 (#1422)
          CSHARP_PASS_RATE=$(sed "s/$(printf '\033')\[[0-9;]*m//g" /tmp/csharp-results.txt | grep -oE 'Pass Rate: [0-9]+' | tail -n1 | sed 's/.*: //')
          [[ "$CSHARP_PASS_RATE" =~ ^[0-9]+$ ]] || { echo "::error::no C# pass rate in the run output"; exit 1; }
          echo "csharp_pass_rate=$CSHARP_PASS_RATE" >> "$GITHUB_OUTPUT"

      - name: Generate agent benchmark results JSON
        env:
          CALOR_PASS_RATE: ${{ steps.calor-benchmark.outputs.calor_pass_rate }}
          CSHARP_PASS_RATE: ${{ steps.csharp-benchmark.outputs.csharp_pass_rate }}
        run: |
          set -euo pipefail
          for rate in "$CALOR_PASS_RATE" "$CSHARP_PASS_RATE"; do
            [[ "$rate" =~ ^[0-9]+$ ]] || { echo "::error::missing pass rate; no results file is written"; exit 1; }
          done
          mkdir -p website/public/data
          cat > website/public/data/agent-refactoring-results.json << EOF
          {
            "version": "1.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "benchmark": "agent-refactoring",
            "description": "Measures Claude Code agent success rates on refactoring tasks",
            "results": {
              "calor": {
                "passRate": $CALOR_PASS_RATE,
                "tasksTotal": 20,
                "category": "refactoring-benchmark"
              },
              "csharp": {
                "passRate": $CSHARP_PASS_RATE,
                "tasksTotal": 20,
                "category": "refactoring-benchmark"
              }
            },
            "methodology": {
              "votingMode": "single-run",
              "agent": "claude-code",
              "verification": ["compilation", "z3-contracts"]
            }
          }
          EOF

      - name: Upload agent benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: agent-refactoring-results
          path: website/public/data/agent-refactoring-results.json
          retention-days: 90

      - name: Report benchmark summary
        run: |
          echo "## Agent Refactoring Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Pass Rate |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Calor | ${{ steps.calor-benchmark.outputs.calor_pass_rate || 'N/A' }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| C# | ${{ steps.csharp-benchmark.outputs.csharp_pass_rate || 'N/A' }}% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The agent refactoring benchmark measures Claude Code's ability to perform" >> $GITHUB_STEP_SUMMARY
          echo "refactoring tasks (rename, extract, inline, move, add contracts, change signature)" >> $GITHUB_STEP_SUMMARY
          echo "on both Calor and C# codebases." >> $GITHUB_STEP_SUMMARY
