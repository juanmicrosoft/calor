name: Benchmarks

# #1410 (0.24 R2): benchmark publication (the results PR and the agent-refactoring
# commit) is gated on one successful #1408 adjudication identity. A dispatch must
# carry the identity and fails before any benchmark runs if it does not verify; the
# publishing steps re-verify that every changed file is an adjudicated benchmark file.
# Push runs measure only and never publish. There is no `release: created` trigger:
# publish-nuget dispatches this workflow from main after the release exists, and a
# dispatch checks out the adjudicated candidate, not the dispatch ref.
# Design: docs/plans/evidence/r2-1410/release-gate.md.
on:
  workflow_dispatch:
    inputs:
      adjudication_identity:
        description: 'calor-adjudication:v1:<adjudication commit>:<terminal record sha256> (#1410)'
        required: true
        type: string
      statistical_runs:
        description: 'Number of statistical runs (default 30)'
        required: false
        default: '30'
      skip_llm:
        description: 'Skip paid LLM benchmarks (default true; opting in requires separate authorization)'
        required: false
        default: 'true'
        type: boolean
      agent_refactoring:
        description: 'Run agent refactoring benchmark'
        required: false
        default: 'false'
        type: boolean
      allow_weaker_methodology:
        description: '#1157: publish even if the result has FEWER statistical runs or a different metric set than the committed one. Only for a deliberate methodology change, which must then be stated in the PR body and CHANGELOG.'
        required: false
        default: 'false'
        type: boolean
  # Run on pushes to benchmark-related files
  push:
    branches: [main]
    paths:
      - 'tests/Calor.Evaluation/**'
      - 'tests/TestData/Benchmarks/**'
      - 'tests/E2E/agent-tasks/**'
      - '.github/workflows/benchmark.yml'

env:
  ADJUDICATION_IDENTITY: ${{ inputs.adjudication_identity }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history for the adjudication gate (it fails, not skips, when shallow).
          fetch-depth: 0

      - name: Verify the adjudication identity (#1410)
        id: gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::benchmark publication is dispatched only from main (got $GITHUB_REF)"; exit 1
          fi
          python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY"

      - name: Check out the candidate and verify the GitHub release (#1410)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.gate.outputs.candidate }}
          TAG: ${{ steps.gate.outputs.tag }}
          VER: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          git checkout -q --detach "$CANDIDATE"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY" \
            --expect-head --require-tag --version "$VER" --release-body "$RUNNER_TEMP/release-body.md"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run static benchmarks
        run: |
          dotnet run --project tests/Calor.Evaluation -c Release -- run \
            --statistical \
            --runs "${{ github.event.inputs.statistical_runs || '30' }}" \
            --format website \
            --output website/public/data/benchmark-results.json \
            --verbose

      - name: Run statistical analysis
        if: github.event.inputs.statistical_runs != ''
        run: |
          RUNS="${{ github.event.inputs.statistical_runs || '30' }}"
          dotnet run --project tests/Calor.Evaluation -c Release -- run \
            --statistical \
            --runs "$RUNS" \
            --format website \
            --output website/public/data/benchmark-results-statistical.json \
            --verbose

      # Paid calls require an explicit manual opt-in, never release/push events.
      - name: Restore LLM response cache
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.calor/llm-cache
          key: llm-cache-${{ github.run_id }}
          restore-keys: |
            llm-cache-

      - name: Run LLM Comprehension evaluation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set, skipping LLM comprehension evaluation"
            exit 0
          fi
          dotnet run --project tests/Calor.Evaluation -c Release -- run \
            --llm \
            --format json \
            --output website/public/data/llm-comprehension-results.json \
            --verbose

      - name: Run TaskCompletion benchmark (LLM)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set, skipping LLM benchmarks"
            exit 0
          fi
          dotnet run --project tests/Calor.Evaluation -c Release -- llm-tasks \
            -m tests/Calor.Evaluation/Tasks/task-manifest.json \
            --budget 5.00 \
            --output website/public/data/llm-results.json \
            --verbose

      - name: Run Safety benchmark (LLM)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            exit 0
          fi
          dotnet run --project tests/Calor.Evaluation -c Release -- safety-benchmark \
            -m tests/Calor.Evaluation/Tasks/task-manifest-safety.json \
            --budget 5.00 \
            --output website/public/data/safety-results.json \
            --verbose

      - name: Run EffectDiscipline benchmark (LLM)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            exit 0
          fi
          dotnet run --project tests/Calor.Evaluation -c Release -- effect-discipline \
            -m tests/Calor.Evaluation/Tasks/task-manifest-effects.json \
            --budget 5.00 \
            --output website/public/data/effect-discipline-results.json \
            --verbose

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Merge LLM results into benchmark-results.json
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_llm == 'false'
        run: |
          node scripts/merge-llm-results.js

      - name: Generate docs/benchmarking/results.md
        run: node scripts/generate-results-md.js

      # #1157: automatic runs now preserve the 30-run methodology. Retain this
      # gate for explicit manual changes to run count or metric set; a weaker
      # measurement must not be presented as a comparable movement in the score.
      - name: Check the result is not a weaker measurement (#1157)
        id: methodology
        run: |
          git show HEAD:website/public/data/benchmark-results.json > /tmp/benchmark-baseline.json \
            || echo '{}' > /tmp/benchmark-baseline.json
          ARGS=""
          if [ "${{ github.event.inputs.allow_weaker_methodology }}" = "true" ]; then
            ARGS="--allow-weaker"
          fi
          {
            echo 'report<<METHODOLOGY_EOF'
            node scripts/check-benchmark-methodology.js \
              website/public/data/benchmark-results.json \
              --baseline /tmp/benchmark-baseline.json $ARGS 2>&1 | tee /dev/stderr
            echo 'METHODOLOGY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            website/public/data/benchmark-results.json
            website/public/data/benchmark-results-statistical.json
            website/public/data/llm-comprehension-results.json
            website/public/data/llm-results.json
            website/public/data/safety-results.json
            website/public/data/effect-discipline-results.json
          retention-days: 90

      # #1410: the publication branch is built here from the candidate and pushed as is.
      # (create-pull-request would re-apply the changes onto main after the check, so the
      # pushed bytes could differ from the verified ones.) The work tree is verified
      # immediately before the commit: every changed file must be an adjudicated benchmark
      # file with the adjudicated hash, and the commit records exactly that tree.
      - name: Verify and publish the benchmark results PR (#1410)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
          VER: ${{ steps.gate.outputs.version }}
          REPORT: ${{ steps.methodology.outputs.report }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY" \
            --expect-head --require-tag --version "$VER" --benchmark-worktree
          BRANCH="benchmark-results-$TAG"
          git switch -q -c "$BRANCH"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && { echo "Adjudicated benchmark files are already in the candidate; nothing to publish."; exit 0; }
          git commit -q -m "chore: publish adjudicated benchmark results for $TAG"
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "Adjudicated benchmark results for $TAG (adjudication identity \`$ADJUDICATION_IDENTITY\`)."
            echo
            echo "## Methodology (#1157)"
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$BRANCH" --title "chore: adjudicated benchmark results for $TAG" --body-file "$RUNNER_TEMP/pr-body.md"

  regression-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: benchmark

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: current-results

      - name: Check for regression
        run: |
          echo "Checking for benchmark regressions..."
          if [ -f "current-results/benchmark-results.json" ]; then
            echo "Benchmark results generated successfully"
            cat current-results/benchmark-results.json | head -50
          else
            echo "Warning: No benchmark results found"
          fi

  # Agent Refactoring Benchmark - compares Calor vs C# refactoring success rates
  # Uses Claude Code CLI to perform refactoring tasks and measures pass rates
  agent-refactoring-benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.agent_refactoring == 'true'
    needs: benchmark
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Restore dependencies
        run: dotnet restore

      - name: Build compiler
        run: dotnet build -c Release --no-restore

      - name: Run Calor refactoring benchmark
        id: calor-benchmark
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd tests/E2E/agent-tasks
          chmod +x run-agent-tests.sh
          ./run-agent-tests.sh --category refactoring-benchmark --filter calor --single-run 2>&1 | tee /tmp/calor-results.txt
          # Extract pass rate
          CALOR_PASS_RATE=$(grep -oP 'Pass Rate: \K[0-9]+' /tmp/calor-results.txt || echo "0")
          echo "calor_pass_rate=$CALOR_PASS_RATE" >> $GITHUB_OUTPUT

      - name: Run C# refactoring benchmark
        id: csharp-benchmark
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd tests/E2E/agent-tasks
          ./run-agent-tests.sh --category refactoring-benchmark --filter csharp --single-run 2>&1 | tee /tmp/csharp-results.txt
          # Extract pass rate
          CSHARP_PASS_RATE=$(grep -oP 'Pass Rate: \K[0-9]+' /tmp/csharp-results.txt || echo "0")
          echo "csharp_pass_rate=$CSHARP_PASS_RATE" >> $GITHUB_OUTPUT

      - name: Generate agent benchmark results JSON
        run: |
          mkdir -p website/public/data
          cat > website/public/data/agent-refactoring-results.json << EOF
          {
            "version": "1.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "benchmark": "agent-refactoring",
            "description": "Measures Claude Code agent success rates on refactoring tasks",
            "results": {
              "calor": {
                "passRate": ${{ steps.calor-benchmark.outputs.calor_pass_rate || 0 }},
                "tasksTotal": 20,
                "category": "refactoring-benchmark"
              },
              "csharp": {
                "passRate": ${{ steps.csharp-benchmark.outputs.csharp_pass_rate || 0 }},
                "tasksTotal": 20,
                "category": "refactoring-benchmark"
              }
            },
            "methodology": {
              "votingMode": "single-run",
              "agent": "claude-code",
              "verification": ["compilation", "z3-contracts"]
            }
          }
          EOF

      - name: Upload agent benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: agent-refactoring-results
          path: website/public/data/agent-refactoring-results.json
          retention-days: 90

      # #1410: this direct commit to main is publication. The gate requires HEAD to be the
      # adjudicated candidate, which a main checkout never is, so this step fails closed;
      # agent results are historical-only in the #1407 inventory and have no 0.24 path.
      - name: Commit agent benchmark results
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY" \
            --expect-head --benchmark-worktree
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main || true
          git add website/public/data/agent-refactoring-results.json || true
          git diff --staged --quiet || git commit -m "chore: Update agent refactoring benchmark results [skip ci]"
          git push || echo "No changes to push"

      - name: Report benchmark summary
        run: |
          echo "## Agent Refactoring Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Pass Rate |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Calor | ${{ steps.calor-benchmark.outputs.calor_pass_rate || 'N/A' }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| C# | ${{ steps.csharp-benchmark.outputs.csharp_pass_rate || 'N/A' }}% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The agent refactoring benchmark measures Claude Code's ability to perform" >> $GITHUB_STEP_SUMMARY
          echo "refactoring tasks (rename, extract, inline, move, add contracts, change signature)" >> $GITHUB_STEP_SUMMARY
          echo "on both Calor and C# codebases." >> $GITHUB_STEP_SUMMARY
