name: Release audit

# #1582: GitHub cannot stop a person with write access from running `gh release create` by hand,
# and a release created that way raises a `release` event (releases that publish-nuget creates
# with GITHUB_TOKEN do not). No publishing workflow listens to `release` events, so a hand-made
# release publishes nothing else. This audit makes a bad one visible: it fails, red, unless the
# release's tag commit is on main and nuget.org serves both calor and Calor.Sdk at the tag's
# version. It changes nothing; correcting the release is a maintainer action.
on:
  release:
    types: [created, published, edited, prereleased, released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to audit (e.g. v0.26.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag commit is on main and nuget.org has both packages
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::release tag '$TAG' is not v<version>"; exit 1; }
          VER="${TAG#v}"
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main' "+refs/tags/$TAG:refs/tags/$TAG"
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::release $TAG points at $commit, which is not on main"; exit 1
          fi
          for id in calor calor.sdk; do
            url="https://api.nuget.org/v3-flatcontainer/$id/$VER/$id.$VER.nupkg"
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" != 200 ]; then
              echo "::error::nuget.org does not serve $id $VER (HTTP $code); release $TAG did not come through publish-nuget"; exit 1
            fi
          done
          echo "release $TAG: tag commit $commit is on main; nuget.org serves calor and calor.sdk $VER"
