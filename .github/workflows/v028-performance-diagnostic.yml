name: Diagnose 0.28 performance gate

on:
  push:
    branches: [diagnostic/v028-performance]
    paths: [.github/workflows/v028-performance-diagnostic.yml]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 08179edbb67c767724a5b3934dc333ffeec49323
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          ref: e45fa725cbd9717f44d9c29534b81657a1b89ce2
          path: .diagnostic/control
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          ref: 08179edbb67c767724a5b3934dc333ffeec49323
          path: .diagnostic/candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-release-sdk
        with:
          also-install: '8.0.426'
      - name: Build immutable subjects with the exact release SDK setup
        run: |
          set -euo pipefail
          dotnet --info
          for subject in . .diagnostic/control .diagnostic/candidate; do
            (
              cd "$subject"
              bash src/Calor.Compiler/scripts/download-z3.sh
              dotnet restore --locked-mode
              dotnet build -c Release --no-restore --verbosity quiet
              dotnet build tests/Calor.Performance.Tests/Calor.Performance.Tests.csproj -c Release --verbosity quiet
            )
          done
      - name: Run the release's preceding self-tests and manifest checks
        run: |
          python3 scripts/test_release_checks.py
          python3 scripts/check_test_quality.py --self-test
          python3 scripts/check_trx.py --self-test
          bash scripts/check_sample_ids.sh --self-test
          python3 scripts/check_coverage.py --self-test
          python3 scripts/run_mutation_gate.py --self-test
          python3 scripts/run_performance_gate.py --self-test
          python3 scripts/run_flake_gate.py --self-test
          bash scripts/compiler-shard-filter.sh --self-test
          python3 scripts/check_test_quality.py
          bash scripts/check_sample_ids.sh
          dotnet build-server shutdown
      - name: Compare release-root and nested subjects on one observed runner
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          reports = root / "artifacts" / "performance-diagnostic"
          reports.mkdir(parents=True)
          outcomes = []
          subjects = {
              "release-root": root,
              "control": root / ".diagnostic" / "control",
              "candidate": root / ".diagnostic" / "candidate",
          }

          def snapshot(label):
              print(f"RESOURCE SNAPSHOT: {label}", flush=True)
              subprocess.run(
                  ["bash", "-c",
                   "lscpu | grep -E 'CPU\\(s\\)|Model name|Hypervisor'; "
                   "free -m; ps -eo pid,comm,rss,pcpu --sort=-rss | head -15; "
                   "cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max; "
                   "cat /proc/pressure/cpu /proc/pressure/memory"],
                  check=True,
              )
              for name, subject in subjects.items():
                  output = subject / "tests/Calor.Performance.Tests/bin/Release/net10.0"
                  for filename in ["calor.dll", "Calor.Performance.Tests.dll"]:
                      print(name, filename, hashlib.sha256((output / filename).read_bytes()).hexdigest(), flush=True)
                  print(name, (output / "Calor.Performance.Tests.runtimeconfig.json").read_text(), flush=True)

          def measure(subject, label):
              result = subprocess.run(
                  ["python3", "scripts/run_performance_gate.py",
                   "--output", str(reports / label / "report.json")],
                  cwd=subjects[subject],
                  check=False,
              )
              outcomes.append({"label": label, "exitCode": result.returncode})
              (reports / "outcomes.json").write_text(json.dumps(outcomes, indent=2) + "\n")
              print(f"DIAGNOSTIC RESULT: {label}: exit {result.returncode}", flush=True)

          snapshot("exact release setup before measurement")
          measure("release-root", "release-root-before")
          measure("candidate", "nested-candidate")
          measure("control", "nested-control")
          snapshot("before repeated root control")
          measure("release-root", "release-root-after")
          snapshot("all measurements complete")
          raise SystemExit(1 if any(row["exitCode"] != 0 for row in outcomes) else 0)
          PY
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v028-exact-release-diagnostic
          path: artifacts/performance-diagnostic/
