name: Experiment Registry Tamper Check

# Enforces the append-only invariant on the two pre-registration registries:
#
#   - docs/experiments/registry.json (§5.0f of
#     docs/plans/calor-native-type-system-v2.md): any PR that modifies an
#     existing entry's fields (or removes an entry) fails. Only net-new entries
#     are permitted.
#
#   - docs/plans/agent-native-gates.md, the A-annex where proof points are
#     registered (docs/plans/roadmap-v0.13-v0.15.md §4.3 (i); annex entry
#     A-1.10): every §A.2 proof-point row and every §A.3 revision-log entry
#     must be byte-identical to the base branch, rows/entries may only be
#     added, every annex change must be logged as a new A-1.N entry, and the
#     annex version pointer must match the newest entry. The exact invariant,
#     and what it does NOT guard, is documented in
#     scripts/check-annex-freeze.py; its --self-test runs first on every
#     invocation so the guard is demonstrably discriminating.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/experiments/registry.json'
      - 'docs/plans/agent-native-gates.md'
      - 'scripts/check-annex-freeze.py'
      - '.github/workflows/experiment-registry-tamper-check.yml'

jobs:
  tamper-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The workflow's paths filter is a union over both registries; skip the
      # dotnet build when this PR leaves registry.json untouched (the validator
      # would only compare the base file with itself).
      - name: Detect registry.json change vs base
        id: registry
        run: |
          if git diff --quiet origin/${{ github.base_ref }} -- docs/experiments/registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "docs/experiments/registry.json is unchanged vs origin/${{ github.base_ref }}; registry validation skipped"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.registry.outputs.changed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        if: steps.registry.outputs.changed == 'true'
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Extract base-branch version of registry.json
        if: steps.registry.outputs.changed == 'true'
        run: |
          git show origin/${{ github.base_ref }}:docs/experiments/registry.json > /tmp/registry-base.json 2>/dev/null \
            || echo '{"entries":[]}' > /tmp/registry-base.json
          echo "Base registry:"
          cat /tmp/registry-base.json

      - name: Build validator CLI
        if: steps.registry.outputs.changed == 'true'
        run: dotnet build src/Calor.Compiler/Calor.Compiler.csproj -c Release --verbosity quiet

      - name: Validate append-only invariant
        if: steps.registry.outputs.changed == 'true'
        run: |
          dotnet run --no-build -c Release --project src/Calor.Compiler -- \
            evaluation registry-validate \
            --base-file /tmp/registry-base.json \
            --head-file docs/experiments/registry.json \
            --json

  annex-freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the annex guard (discriminating pins run first, every time)
        run: python3 scripts/check-annex-freeze.py --self-test

      # No empty-file fallback: the annex has existed since 2026-07-24, so a
      # failed `git show` is a misconfiguration and must fail the job rather
      # than pass the check against an empty base.
      - name: Extract base-branch version of the annex
        run: git show origin/${{ github.base_ref }}:docs/plans/agent-native-gates.md > /tmp/annex-base.md

      - name: Validate annex freeze (frozen rows and entries are append-only)
        run: |
          python3 scripts/check-annex-freeze.py \
            --base-file /tmp/annex-base.md \
            --head-file docs/plans/agent-native-gates.md
