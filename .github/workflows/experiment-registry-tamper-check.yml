name: Experiment Registry Tamper Check

# Enforces the append-only invariant on the two pre-registration registries:
#
#   - docs/experiments/registry.json (§5.0f of
#     docs/plans/calor-native-type-system-v2.md): any PR that modifies an
#     existing entry's fields (or removes an entry) fails. Only net-new entries
#     are permitted.
#
#   - docs/plans/agent-native-gates.md, the A-annex where proof points are
#     registered (docs/plans/roadmap-v0.13-v0.15.md §4.3 (i); annex entry
#     A-1.10): every §A.2 proof-point row, table header and §A.3 revision-log
#     entry must be byte-identical to the base branch, rows/entries may only
#     be added, every annex change must be logged as a new A-1.N entry, and the
#     annex version pointer must match the newest entry. The exact invariant,
#     and what it does NOT guard, is documented in
#     scripts/check-annex-freeze.py.
#
# No `paths:` filter, deliberately: both jobs run on EVERY PR to main (the
# test.yml `detect-changes` precedent — always run, filter inside) so that
# `annex-freeze` can be a required status check; it costs ~0.1 s and passes
# trivially when the annex is unchanged. The registry job skips its dotnet
# build internally when registry.json is unchanged. Direct pushes to main are
# also checked (HEAD^ vs HEAD) so an unreviewed push leaves a red record.
#
# The annex guard executed is the BASE-branch copy of the script, not the PR's
# — otherwise a PR could neuter check() and its self-test together. A PR that
# changes the annex together with the guard script or this workflow is refused
# outright; land the guard change first, then the annex change.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tamper-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base ref (PR base branch, or HEAD^ on a push to main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "BASE=HEAD^" >> "$GITHUB_ENV"
          fi

      # Skip the dotnet build when this event leaves registry.json untouched
      # (the validator would only compare the base file with itself).
      - name: Detect registry.json change vs base
        id: registry
        run: |
          if git diff --quiet "$BASE" HEAD -- docs/experiments/registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "docs/experiments/registry.json is unchanged vs $BASE; registry validation skipped"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.registry.outputs.changed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        if: steps.registry.outputs.changed == 'true'
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Extract base-branch version of registry.json
        if: steps.registry.outputs.changed == 'true'
        run: |
          git show "$BASE":docs/experiments/registry.json > /tmp/registry-base.json 2>/dev/null \
            || echo '{"entries":[]}' > /tmp/registry-base.json
          echo "Base registry:"
          cat /tmp/registry-base.json

      - name: Build validator CLI
        if: steps.registry.outputs.changed == 'true'
        run: dotnet build src/Calor.Compiler/Calor.Compiler.csproj -c Release --verbosity quiet

      - name: Validate append-only invariant
        if: steps.registry.outputs.changed == 'true'
        run: |
          dotnet run --no-build -c Release --project src/Calor.Compiler -- \
            evaluation registry-validate \
            --base-file /tmp/registry-base.json \
            --head-file docs/experiments/registry.json \
            --json

  annex-freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base ref (PR base branch, or HEAD^ on a push to main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "BASE=HEAD^" >> "$GITHUB_ENV"
          fi

      # The guard that judges the annex is the one already on the base branch.
      # Bootstrap case (the PR that introduces the guard; base has no copy):
      # fall back to the head copy and say so loudly. After that PR merges the
      # base path is always taken.
      - name: Select the BASE-branch copy of the guard
        run: |
          if git show "$BASE":scripts/check-annex-freeze.py > /tmp/guard.py 2>/dev/null; then
            echo "GUARD_BOOTSTRAP=false" >> "$GITHUB_ENV"
            echo "Using the base-branch guard ($BASE:scripts/check-annex-freeze.py)"
          else
            rm -f /tmp/guard.py
            cp scripts/check-annex-freeze.py /tmp/guard.py
            echo "GUARD_BOOTSTRAP=true" >> "$GITHUB_ENV"
            echo "::warning::BOOTSTRAP: base guard absent on $BASE — running the head copy of scripts/check-annex-freeze.py this once"
            echo "BOOTSTRAP: base guard absent on $BASE — running the head copy of scripts/check-annex-freeze.py this once"
          fi

      # A guard change and an annex change never ride together: the annex
      # would be judged by a guard nobody has reviewed against it yet.
      - name: Refuse a PR that changes the annex together with the guard or this workflow
        run: |
          changed="$(git diff --name-only "$BASE" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qx 'docs/plans/agent-native-gates.md' \
             && echo "$changed" | grep -qxE 'scripts/check-annex-freeze\.py|\.github/workflows/experiment-registry-tamper-check\.yml'; then
            if [ "$GUARD_BOOTSTRAP" = "true" ]; then
              echo "BOOTSTRAP: annex + guard co-change tolerated only for the PR that introduces the guard"
            else
              echo "::error::docs/plans/agent-native-gates.md must not change in the same PR as scripts/check-annex-freeze.py or this workflow. Land the guard change first."
              exit 1
            fi
          fi

      - name: Self-test the base guard (discriminating pins run first, every time)
        run: python3 /tmp/guard.py --self-test --head-file docs/plans/agent-native-gates.md

      # No empty-file fallback: the annex has existed since 2026-07-24, so a
      # failed `git show` is a misconfiguration and must fail the job rather
      # than pass the check against an empty base (the guard rejects an empty
      # base as well).
      - name: Extract base-branch version of the annex
        run: git show "$BASE":docs/plans/agent-native-gates.md > /tmp/annex-base.md

      - name: Validate annex freeze (frozen rows, headers and entries are append-only)
        run: |
          python3 /tmp/guard.py \
            --base-file /tmp/annex-base.md \
            --head-file docs/plans/agent-native-gates.md
