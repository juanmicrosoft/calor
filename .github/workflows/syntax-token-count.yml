name: Syntax token count (count-only, #1597)

# Manual, count-only syntax measurement for #1597/#1603/#1614. It calls Anthropic
# GET /v1/models (to resolve the manifest's exact display name to a provider ID)
# and POST /v1/messages/count_tokens, nothing else: no completion, generation or
# agent run, and no benchmark.yml stage. A missing key, an unresolved or
# ambiguous model, any failed request, or a digest mismatch fails the run and
# writes no results; there are no offline or proxy counts.
#
# Prepared payloads are not stored on main. A maintainer publishes them as data
# in a pinned commit (payload_commit) and passes the inputs_sha256 that
# `count_tokens.py --validate-only` printed for the reviewed bytes. Nothing from
# that commit is executed; the tool always comes from the dispatched commit.
# Offline controls: scripts/test_count_tokens.py checks this file's invariants.

on:
  workflow_dispatch:
    inputs:
      payload_commit:
        description: "40-hex commit holding the prepared payload directory (data only)"
        required: true
      manifest_path:
        description: "Manifest path inside payload_commit"
        required: true
        default: "syntax-candidates/manifest.json"
      inputs_sha256:
        description: "inputs_sha256 printed by count_tokens.py --validate-only for the reviewed payloads"
        required: true
      max_requests:
        description: "Upper bound on provider requests (1 metadata listing + 1 per payload)"
        required: true
        default: "400"
      confirm:
        description: "Type count-tokens-only (no generation, completion or agent requests)"
        required: true

permissions:
  contents: read

concurrency:
  group: syntax-token-count
  cancel-in-progress: false

env:
  TARGET_MODEL: "Claude Opus 5.5"
  PAYLOAD_COMMIT: ${{ inputs.payload_commit }}
  MANIFEST_PATH: ${{ inputs.manifest_path }}
  INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
  MAX_REQUESTS: ${{ inputs.max_requests }}
  CONFIRM: ${{ inputs.confirm }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check dispatch inputs and ref
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail "dispatch from main only"
          [[ "$CONFIRM" == count-tokens-only ]] || fail "confirm must be count-tokens-only"
          [[ "$PAYLOAD_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "payload_commit must be a 40-hex commit"
          [[ "$INPUTS_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "inputs_sha256 must be 64 hex"
          [[ "$MAX_REQUESTS" =~ ^[1-9][0-9]{0,3}$ ]] || fail "max_requests must be 1-9999"
          [[ "$MANIFEST_PATH" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*\.json$ ]] || fail "bad manifest_path"
          [[ "/$MANIFEST_PATH/" != */../* && "/$MANIFEST_PATH/" != */./* ]] || fail "bad manifest_path"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.payload_commit }}
          path: payload
          persist-credentials: false

      - name: Offline count_tokens controls
        run: python3 scripts/test_count_tokens.py

      - name: Validate exact payloads (no credential)
        run: |
          set -euo pipefail
          python3 scripts/count_tokens.py "payload/$MANIFEST_PATH" --validate-only \
            --expect-inputs-sha256 "$INPUTS_SHA256" --expect-target-model "$TARGET_MODEL" \
            --max-requests "$MAX_REQUESTS"

  count:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: anthropic-count-tokens
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.payload_commit }}
          path: payload
          persist-credentials: false

      - name: Count tokens (count_tokens endpoint only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/syntax-token-count"
          mkdir -p "$out"
          python3 scripts/count_tokens.py "payload/$MANIFEST_PATH" \
            --output "$out/results.json" --table "$out/results.md" \
            --expect-inputs-sha256 "$INPUTS_SHA256" --expect-target-model "$TARGET_MODEL" \
            --max-requests "$MAX_REQUESTS" \
            --attest-tool-commit "$GITHUB_SHA" --attest-payload-commit "$PAYLOAD_COMMIT"
          if grep -rqF -- "$ANTHROPIC_API_KEY" "$out"; then
            rm -rf "$out"
            echo "::error::credential found in results; discarded"
            exit 1
          fi
          cat "$out/results.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: syntax-token-count-${{ github.run_id }}
          path: ${{ runner.temp }}/syntax-token-count/
          if-no-files-found: error
          retention-days: 90
