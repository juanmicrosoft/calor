name: determinism-protocol

# 0.24 G2 (#1421): execution machinery for the registered verifier determinism protocol
# (docs/plans/evidence/g2-1421/protocol.json, amendment 1.1.0). #1135 executes it. Dispatch
# only: no automatic trigger. Every dispatched run is charged to determinism-compute, and the
# plan job refuses a re-run, an executed commit, a docs-only repair, or a run over the budget.
# scripts/determinism_runner.py checks this file's structure (workflow_problems).

run-name: determinism ${{ inputs.mode }} ${{ inputs.execution_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [control, execution]
        required: true
      execution_id:
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: determinism-protocol
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
      execution: ${{ steps.plan.outputs.execution }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate, check history and budget, and plan the run
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          EXECUTION: ${{ inputs.execution_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show origin/main:scripts/determinism_protocol.py > "$RUNNER_TEMP/determinism_protocol_main.py"
          python3 scripts/determinism_runner.py plan --mode "$MODE" --execution-id "$EXECUTION" \
            --main-validator "$RUNNER_TEMP/determinism_protocol_main.py" --github-output "$GITHUB_OUTPUT"

  attempts:
    needs: plan
    name: attempts (${{ matrix.env }} job ${{ matrix.job }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      # The global git config, NuGet packages, and every home directory live under the job's temp
      # directory, so no step reads or writes the runner's real home directory.
      - name: Check out committed line endings
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/determinism-gitconfig" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/determinism-nuget" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/determinism" >> "$GITHUB_ENV"
          GIT_CONFIG_GLOBAL="$RUNNER_TEMP/determinism-gitconfig" git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET (pinned, private root)
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-1421
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Bootstrap verified Z3 assets
        uses: ./.github/actions/bootstrap-z3

      - name: Check and record the environment
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" scripts/determinism_runner.py env-check --env "${{ matrix.env }}" --dotnet-root "$RUNNER_TEMP/dotnet-1421" --out "$OUT"

      - name: Build the registered test hosts
        env:
          HOME: ${{ runner.temp }}/determinism-build-home
          USERPROFILE: ${{ runner.temp }}/determinism-build-home
          DOTNET_CLI_HOME: ${{ runner.temp }}/determinism-build-home
          PROJECTS: ${{ matrix.projects }}
        run: |
          set -euo pipefail
          for project in $PROJECTS; do
            dotnet build "$project" -c Release
          done

      - name: Run every attempt of this job
        timeout-minutes: ${{ matrix.stepTimeout }}
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" scripts/determinism_runner.py run-job --env "${{ matrix.env }}" --job "${{ matrix.job }}" \
            --mode "${{ needs.plan.outputs.mode }}" --execution-id "${{ needs.plan.outputs.execution }}" --out "$OUT"

      - name: Record attempts that did not run
        if: always()
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" scripts/determinism_runner.py fill-missing --env "${{ matrix.env }}" --job "${{ matrix.job }}" \
            --mode "${{ needs.plan.outputs.mode }}" --execution-id "${{ needs.plan.outputs.execution }}" --out "$OUT"

      - name: Upload attempt records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attempts-${{ needs.plan.outputs.execution }}-${{ matrix.env }}-j${{ matrix.job }}-r${{ github.run_attempt }}
          path: ${{ runner.temp }}/determinism/
          if-no-files-found: error
          retention-days: 90

  decide:
    needs: [plan, attempts]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download every attempt record
        uses: actions/download-artifact@v4
        with:
          pattern: attempts-${{ needs.plan.outputs.execution }}-*
          path: ${{ runner.temp }}/records

      # Exits non-zero unless DETERMINISTIC (CONTROL-DETERMINISTIC in control mode).
      - name: Decide agreement under the frozen rule
        run: |
          set -euo pipefail
          python3 scripts/determinism_runner.py decide --records "$RUNNER_TEMP/records" \
            --execution-id "${{ needs.plan.outputs.execution }}" --mode "${{ needs.plan.outputs.mode }}" \
            --out "$RUNNER_TEMP/result/result.json"

      - name: Upload the result record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ needs.plan.outputs.execution }}-r${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 90
