name: Publish to NuGet

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use project version)'
        required: false
        type: string

env:
  Z3_VERSION: "4.15.7"

jobs:
  # Truthful release gates (#790, W1 Slice 4): publishing is impossible unless
  # the full test suite and the M-A1 packaged-SDK consumer check pass on the
  # same commit being published.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # This is the RELEASE GATE. Without seeding, src/Calor.Compiler/{z3,runtimes}/ are
      # empty at MSBuild evaluation time (they are gitignored), the csproj's
      # `<None Include="runtimes\**\*">` glob matches nothing, the natives never reach the
      # test hosts, and all 358 Z3-backed tests SKIP — so the gate that authorizes shipping
      # to NuGet would go green having verified none of the verification surface. The
      # `publish` job below already stages the natives before restore for this same reason.
      - name: Seed Z3 native libraries (before MSBuild evaluation)
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run all tests
        run: |
          set -euo pipefail
          dotnet test -c Release --no-build --verbosity normal 2>&1 | tee test-output.log

      # Assert the property that matters, not a filename: no Z3-gated test may skip on the
      # commit being released. This regression is invisible by construction otherwise —
      # the tests skip rather than fail.
      - name: Assert no Z3-gated test silently skipped
        run: |
          set -euo pipefail
          if grep -q "Z3 not available" test-output.log; then
            echo "::error::Z3-gated tests skipped on the release commit — natives did not reach the test hosts."
            grep -c "Z3 not available" test-output.log
            exit 1
          fi

  sdk-consumer:
    # M-A1: a template consumer restores/builds/tests green against the
    # packaged Calor.Sdk from a local feed (wedge plan v0.11 D-W1.2, PP-A1).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run M-A1 consumer check
        env:
          CALOR_SDK_REQUIRE_ALL_RIDS: "1"
        run: bash .github/scripts/test-sdk-package.sh

  publish:
    runs-on: ubuntu-latest
    needs: [test, sdk-consumer]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Download pre-built Z3 binaries from our z3-binaries release
      - name: Download Z3 binaries
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/z3-binaries-${{ env.Z3_VERSION }}"

          mkdir -p src/Calor.Compiler/z3
          mkdir -p src/Calor.Compiler/runtimes/linux-x64/native
          mkdir -p src/Calor.Compiler/runtimes/linux-arm64/native
          mkdir -p src/Calor.Compiler/runtimes/osx-arm64/native
          mkdir -p src/Calor.Compiler/runtimes/win-x64/native
          mkdir -p src/Calor.Compiler/runtimes/win-x86/native
          mkdir -p src/Calor.Compiler/runtimes/win-arm64/native

          # W1 Slice 2 (#789): fail-closed, checksum-verified downloads. The old
          # bare `curl -L` (no -f, no verification) would have silently packed a
          # 404 HTML page into the shipped nupkg as libz3.
          set -euo pipefail
          MANIFEST=".github/z3-binaries-${{ env.Z3_VERSION }}.sha256"
          if [ ! -s "$MANIFEST" ]; then
            echo "::error::Z3 checksum manifest $MANIFEST is missing or empty — refusing to pack unverified natives"
            exit 1
          fi

          STAGING="$(mktemp -d)"
          ASSETS="Microsoft.Z3.dll libz3-linux-x64.so libz3-linux-arm64.so libz3-osx-arm64.dylib libz3-win-x64.dll libz3-win-x86.dll libz3-win-arm64.dll"
          for asset in $ASSETS; do
            curl -fL -sS --retry 5 --retry-delay 3 -o "$STAGING/$asset" "${RELEASE_URL}/${asset}"
          done

          (cd "$STAGING" && grep -v '^#' "$GITHUB_WORKSPACE/$MANIFEST" | sha256sum --check --strict -)

          mv "$STAGING/Microsoft.Z3.dll"      src/Calor.Compiler/z3/Microsoft.Z3.dll
          mv "$STAGING/libz3-linux-x64.so"    src/Calor.Compiler/runtimes/linux-x64/native/libz3.so
          mv "$STAGING/libz3-linux-arm64.so"  src/Calor.Compiler/runtimes/linux-arm64/native/libz3.so
          mv "$STAGING/libz3-osx-arm64.dylib" src/Calor.Compiler/runtimes/osx-arm64/native/libz3.dylib
          mv "$STAGING/libz3-win-x64.dll"     src/Calor.Compiler/runtimes/win-x64/native/libz3.dll
          mv "$STAGING/libz3-win-x86.dll"     src/Calor.Compiler/runtimes/win-x86/native/libz3.dll
          mv "$STAGING/libz3-win-arm64.dll"   src/Calor.Compiler/runtimes/win-arm64/native/libz3.dll

          echo "Downloaded and checksum-verified Z3 binaries:"
          find src/Calor.Compiler/z3 src/Calor.Compiler/runtimes -type f -ls

      - name: Restore dependencies
        run: dotnet restore src/Calor.Compiler/Calor.Compiler.csproj

      - name: Build
        run: dotnet build src/Calor.Compiler/Calor.Compiler.csproj -c Release --no-restore

      # Atomic same-version publish (#787): pack BOTH packages first, push only
      # after both packed successfully — the CLI and the SDK ship together or
      # not at all.
      - name: Pack CLI + SDK
        run: |
          set -euo pipefail
          VERSION_ARG=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_ARG="/p:Version=${{ github.event.inputs.version }}"
          fi
          dotnet pack src/Calor.Compiler/Calor.Compiler.csproj -c Release --no-build -o ./nupkg $VERSION_ARG
          dotnet pack src/Calor.Sdk/Calor.Sdk.csproj -c Release -o ./nupkg /p:CalorSdkRequireAllRids=true $VERSION_ARG

      - name: Inspect Calor.Sdk package contents
        run: |
          set -euo pipefail
          SDK_NUPKG=$(ls ./nupkg/Calor.Sdk.*.nupkg)
          bash .github/scripts/inspect-sdk-nupkg.sh "$SDK_NUPKG" --all-rids

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg
