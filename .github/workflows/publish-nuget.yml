name: Publish to NuGet

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use project version)'
        required: false
        type: string

env:
  Z3_VERSION: "4.15.7"

jobs:
  # Truthful release gates (#790, W1 Slice 4): publishing is impossible unless
  # the full test suite and the M-A1 packaged-SDK consumer check pass on the
  # same commit being published.
  test:
    # One project per runner, mirroring test.yml's matrix.
    #
    # This job previously ran all 13 release-critical projects SEQUENTIALLY on a
    # single runner, and that is what blocked the v0.13.1 publish twice: the
    # first attempt died with `terminate called after throwing 'std::system_error'`
    # (thread/process creation failing under resource exhaustion) and the second
    # took SIGTERM (exit 143) immediately after Calor.Performance.Tests — i.e.
    # entering Calor.RoundTrip.Harness.Tests, which drives full builds and test
    # runs of three external corpus repositories. Neither run came near the
    # 40-minute timeout; the runner simply gave out.
    #
    # test.yml has always sharded these, which is why the same suite passes
    # there. The gate is unchanged in strength — `publish` still needs every leg
    # green on the commit being released — only the packing changes.
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler
            project: tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          - name: conversion
            project: tests/Calor.Conversion.Tests/Calor.Conversion.Tests.csproj
          - name: enforcement
            project: tests/Calor.Enforcement.Tests/Calor.Enforcement.Tests.csproj
          - name: evaluation
            project: tests/Calor.Evaluation/Calor.Evaluation.csproj
          - name: experimental
            project: tests/Calor.Experimental.Tests/Calor.Experimental.Tests.csproj
          - name: ids
            project: tests/Calor.Ids.Tests/Calor.Ids.Tests.csproj
          - name: il-analysis
            project: tests/Calor.ILAnalysis.Tests/Calor.ILAnalysis.Tests.csproj
          - name: language-server
            project: tests/Calor.LanguageServer.Tests/Calor.LanguageServer.Tests.csproj
          - name: performance
            project: tests/Calor.Performance.Tests/Calor.Performance.Tests.csproj
          - name: roundtrip-harness
            project: tests/Calor.RoundTrip.Harness.Tests/Calor.RoundTrip.Harness.Tests.csproj
          - name: semantics
            project: tests/Calor.Semantics.Tests/Calor.Semantics.Tests.csproj
          - name: tasks
            project: tests/Calor.Tasks.Tests/Calor.Tasks.Tests.csproj
          - name: verification
            project: tests/Calor.Verification.Tests/Calor.Verification.Tests.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # This is the RELEASE GATE. Without seeding, src/Calor.Compiler/{z3,runtimes}/ are
      # empty at MSBuild evaluation time (they are gitignored), the csproj's
      # `<None Include="runtimes\**\*">` glob matches nothing, the natives never reach the
      # test hosts, and all Z3-backed tests SKIP — so the gate that authorizes shipping
      # to NuGet would go green having verified none of the verification surface. The
      # `publish` job below already stages the natives before restore for this same reason.
      - name: Seed Z3 native libraries (before MSBuild evaluation)
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Assert this project is release-critical in the manifest
        # Guards the matrix against drift: if a project is added to or removed
        # from the manifest's release-critical set without updating this list,
        # the gate would silently stop covering it.
        run: |
          set -euo pipefail
          python3 - "${{ matrix.project }}" <<'PY'
          import json, sys
          project = sys.argv[1]
          manifest = json.load(open("eng/test-manifest.json"))["projects"]
          if not any(p["path"] == project and p["releaseCritical"] for p in manifest):
              sys.exit(f"::error::{project} is not release-critical in eng/test-manifest.json")
          PY

      - name: Run project tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/test
          dotnet test "${{ matrix.project }}" -c Release \
            --logger "trx;LogFileName=${{ matrix.name }}.trx" \
            --results-directory artifacts/test \
            --verbosity normal 2>&1 | tee test-output.log

      - name: Enforce test inventory
        run: >-
          python3 scripts/check_trx.py
          --trx "artifacts/test/${{ matrix.name }}.trx"
          --project "${{ matrix.project }}"

      # Assert the property that matters, not a filename: no Z3-gated test may skip on the
      # commit being released. This regression is invisible by construction otherwise —
      # the tests skip rather than fail.
      - name: Assert no Z3-gated test silently skipped
        run: |
          set -euo pipefail
          if grep -q "Z3 not available" test-output.log; then
            echo "::error::Z3-gated tests skipped on the release commit — natives did not reach the test hosts."
            grep -c "Z3 not available" test-output.log
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports-${{ matrix.name }}
          path: artifacts/test/
          retention-days: 90

  sdk-consumer:
    # M-A1: a template consumer restores/builds/tests green against the
    # packaged Calor.Sdk from a local feed (wedge plan v0.11 D-W1.2, PP-A1).
    name: sdk-consumer (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        if: runner.os != 'Windows'
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Bootstrap verified Z3 assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File src/Calor.Compiler/scripts/download-z3.ps1

      - name: Run M-A1 consumer check
        env:
          CALOR_SDK_REQUIRE_ALL_RIDS: "1"
          CALOR_SDK_VERSION: ${{ github.event.inputs.version }}
          CALOR_SDK_EXPECTED_RID: ${{ matrix.rid }}
        run: bash .github/scripts/test-sdk-package.sh

  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code and round-trip corpus
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 8 for corpus targets
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Seed Z3 native libraries
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore and build
        run: |
          dotnet restore --locked-mode
          dotnet build -c Release --no-restore
          dotnet build tests/Calor.Performance.Tests/Calor.Performance.Tests.csproj -c Release

      - name: Run negative gate self-tests
        run: |
          python3 scripts/check_test_quality.py --self-test
          python3 scripts/check_trx.py --self-test
          bash scripts/check_sample_ids.sh --self-test
          python3 scripts/check_coverage.py --self-test
          python3 scripts/run_mutation_gate.py --self-test
          python3 scripts/run_performance_gate.py --self-test
          python3 scripts/run_flake_gate.py --self-test

      - name: Check manifest, skips, assertions, and sample IDs
        run: |
          python3 scripts/check_test_quality.py
          bash scripts/check_sample_ids.sh

      - name: Collect and enforce component coverage
        run: |
          set -euo pipefail
          for project in \
            Calor.Compiler.Tests \
            Calor.Conversion.Tests \
            Calor.Enforcement.Tests \
            Calor.Semantics.Tests \
            Calor.Verification.Tests
          do
            dotnet test "tests/$project/$project.csproj" \
              -c Release --no-build --no-restore \
              --collect:"XPlat Code Coverage" \
              --logger "trx;LogFileName=$project.trx" \
              --results-directory "artifacts/coverage/raw/$project" \
              --verbosity quiet
          done
          python3 scripts/check_coverage.py

      - name: Run mutation, performance, and release flake ratchets
        run: |
          python3 scripts/run_mutation_gate.py
          python3 scripts/run_performance_gate.py
          python3 scripts/run_flake_gate.py --runs 100

      - name: Run blocking round-trip verification
        run: |
          dotnet run --project tools/Calor.RoundTrip.Harness/ -c Release -- \
            run --all --dotnet dotnet --output artifacts/migration/roundtrip

      - name: Generate migration scorecard
        run: |
          mkdir -p artifacts/migration
          dotnet run --project tests/Calor.Evaluation -c Release -- \
            scorecard --format both -o artifacts/migration/conversion-scorecard

      - name: Upload release quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-reports
          path: |
            artifacts/coverage/
            artifacts/mutation/
            artifacts/performance/
            artifacts/flake/
            artifacts/migration/
          retention-days: 90

  publish:
    runs-on: ubuntu-latest
    needs: [test, sdk-consumer, release-quality]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Download pre-built Z3 binaries from our z3-binaries release
      - name: Download Z3 binaries
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/z3-binaries-${{ env.Z3_VERSION }}"

          mkdir -p src/Calor.Compiler/z3
          mkdir -p src/Calor.Compiler/runtimes/linux-x64/native
          mkdir -p src/Calor.Compiler/runtimes/linux-arm64/native
          mkdir -p src/Calor.Compiler/runtimes/osx-arm64/native
          mkdir -p src/Calor.Compiler/runtimes/win-x64/native
          mkdir -p src/Calor.Compiler/runtimes/win-arm64/native

          # W1 Slice 2 (#789): fail-closed, checksum-verified downloads. The old
          # bare `curl -L` (no -f, no verification) would have silently packed a
          # 404 HTML page into the shipped nupkg as libz3.
          set -euo pipefail
          MANIFEST=".github/z3-binaries-${{ env.Z3_VERSION }}.sha256"
          if [ ! -s "$MANIFEST" ]; then
            echo "::error::Z3 checksum manifest $MANIFEST is missing or empty — refusing to pack unverified natives"
            exit 1
          fi

          STAGING="$(mktemp -d)"
          # The checksum manifest also tracks the standalone win-x86 Z3 build,
          # but .NET 10 has no x86 SDK, so that asset is verified but not staged
          # into Calor packages.
          ASSETS="Microsoft.Z3.dll libz3-linux-x64.so libz3-linux-arm64.so libz3-osx-arm64.dylib libz3-win-x64.dll libz3-win-x86.dll libz3-win-arm64.dll"
          for asset in $ASSETS; do
            curl -fL -sS --retry 10 --retry-all-errors --retry-max-time 300 -o "$STAGING/$asset" "${RELEASE_URL}/${asset}"
          done

          while read -r hash asset size; do
            test "$(wc -c < "$STAGING/$asset" | tr -d ' ')" = "$size"
          done < <(grep -v '^#' "$MANIFEST" | awk 'NF')
          (cd "$STAGING" && grep -v '^#' "$GITHUB_WORKSPACE/$MANIFEST" | awk 'NF {print $1 "  " $2}' | sha256sum --check --strict -)

          mv "$STAGING/Microsoft.Z3.dll"      src/Calor.Compiler/z3/Microsoft.Z3.dll
          mv "$STAGING/libz3-linux-x64.so"    src/Calor.Compiler/runtimes/linux-x64/native/libz3.so
          mv "$STAGING/libz3-linux-arm64.so"  src/Calor.Compiler/runtimes/linux-arm64/native/libz3.so
          mv "$STAGING/libz3-osx-arm64.dylib" src/Calor.Compiler/runtimes/osx-arm64/native/libz3.dylib
          mv "$STAGING/libz3-win-x64.dll"     src/Calor.Compiler/runtimes/win-x64/native/libz3.dll
          mv "$STAGING/libz3-win-arm64.dll"   src/Calor.Compiler/runtimes/win-arm64/native/libz3.dll

          echo "Downloaded and checksum-verified Z3 binaries:"
          find src/Calor.Compiler/z3 src/Calor.Compiler/runtimes -type f -ls

      - name: Restore dependencies
        run: dotnet restore src/Calor.Compiler/Calor.Compiler.csproj --locked-mode

      - name: Build
        run: dotnet build src/Calor.Compiler/Calor.Compiler.csproj -c Release --no-restore

      # Atomic same-version publish (#787): pack BOTH packages first, push only
      # after both packed successfully — the CLI and the SDK ship together or
      # not at all.
      - name: Pack CLI + SDK
        run: |
          set -euo pipefail
          VERSION_ARG=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_ARG="/p:Version=${{ github.event.inputs.version }}"
          fi
          dotnet pack src/Calor.Compiler/Calor.Compiler.csproj -c Release --no-build -o ./nupkg $VERSION_ARG
          dotnet pack src/Calor.Sdk/Calor.Sdk.csproj -c Release -o ./nupkg /p:CalorSdkRequireAllRids=true $VERSION_ARG

      - name: Inspect Calor.Sdk package contents
        run: |
          set -euo pipefail
          SDK_NUPKG=$(ls ./nupkg/Calor.Sdk.*.nupkg)
          bash .github/scripts/inspect-sdk-nupkg.sh "$SDK_NUPKG" --all-rids

      - name: Generate SBOM and provenance
        run: |
          python3 scripts/generate-release-metadata.py \
            --name "calor-nuget-${{ github.sha }}" \
            --artifacts ./nupkg \
            --output ./release-metadata \
            --repository "${{ github.server_url }}/${{ github.repository }}" \
            --commit "${{ github.sha }}"

      - name: Attest NuGet packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ./nupkg/*.nupkg
            ./release-metadata/*.json

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            ./nupkg/*.nupkg
            ./release-metadata/*.json

      - name: Attach release metadata
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./release-metadata/*.json --clobber
