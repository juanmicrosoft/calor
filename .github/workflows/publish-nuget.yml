name: Publish to NuGet

# The only release path (#1582). A release is a dispatch from main that names the version in
# Directory.Build.props; CHANGELOG.md must hold its `## [X.Y.Z]` section. Order:
#   preflight -> test, sdk-consumer, release-quality -> package (pack both, inspect, Z3 pin,
#   SBOM, notes, wording scan, existing-version compare; needs the site build and scan) ->
#   publish (OIDC exchange in the main-only nuget-release environment, attest, push,
#   served-package compare) -> install-check (installs calor from nuget.org) -> release (GitHub
#   release, metadata) -> website dispatch.
# Every step before the push blocks the push; every step after it blocks the GitHub release,
# its metadata, and the website. `dry_run: true` runs everything up to, not including, the
# publish job, so it never reaches the OIDC exchange. The workflow creates the tag; there is no
# tag-push trigger (a `v*` trigger would let any writer push a tag carrying an edited workflow
# into the publish job, #1545). It never dispatches benchmark publication (#1547).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal <Version> in Directory.Build.props on main'
        required: true
        type: string
      dry_run:
        description: 'Run every check and pack, but stop before the publish job (no OIDC exchange, no push)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.release.outputs.candidate }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Refuse a dispatch from any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish-nuget runs only from main (got $GITHUB_REF)"
          exit 1

      - name: Checkout main with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The version must equal Directory.Build.props, CHANGELOG.md must hold one non-empty
      # section for it, and a tag v<version> must be absent or already at this commit. A dry run
      # reports an existing tag at another commit as a warning; a release fails on it.
      - name: Check the version, CHANGELOG section, and tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/release_checks.py preflight --version "$VERSION" --dry-run "$DRY_RUN"

  test:
    # One project per runner, mirroring test.yml's matrix. A single runner running all 13
    # projects ran out of resources and blocked the v0.13.1 publish twice. `package` (and so the
    # push) needs every leg green on the commit being released.
    name: test (${{ matrix.name }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler
            project: tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          - name: conversion
            project: tests/Calor.Conversion.Tests/Calor.Conversion.Tests.csproj
          - name: enforcement
            project: tests/Calor.Enforcement.Tests/Calor.Enforcement.Tests.csproj
          - name: evaluation
            project: tests/Calor.Evaluation/Calor.Evaluation.csproj
          - name: experimental
            project: tests/Calor.Experimental.Tests/Calor.Experimental.Tests.csproj
          - name: ids
            project: tests/Calor.Ids.Tests/Calor.Ids.Tests.csproj
          - name: il-analysis
            project: tests/Calor.ILAnalysis.Tests/Calor.ILAnalysis.Tests.csproj
          - name: language-server
            project: tests/Calor.LanguageServer.Tests/Calor.LanguageServer.Tests.csproj
          - name: performance
            project: tests/Calor.Performance.Tests/Calor.Performance.Tests.csproj
          - name: roundtrip-harness
            project: tests/Calor.RoundTrip.Harness.Tests/Calor.RoundTrip.Harness.Tests.csproj
          - name: semantics
            project: tests/Calor.Semantics.Tests/Calor.Semantics.Tests.csproj
          - name: tasks
            project: tests/Calor.Tasks.Tests/Calor.Tasks.Tests.csproj
          - name: verification
            project: tests/Calor.Verification.Tests/Calor.Verification.Tests.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate }}
          persist-credentials: false
          submodules: recursive
          # #1159/#1417: LedgerCommitStampTests needs full history and fetched
          # protected main to decide whether each provenance identity is durable.
          # Under a depth-1 checkout it used to SKIP — that extra skip once failed
          # `Enforce test inventory` ("executed 8043, expected 8044") and shipped
          # nothing. It now FAILS instead. The release path is where provenance
          # most wants verifying.
          fetch-depth: 0

      # #1417 (v0.24 §6): provenance identities resolve from fetched protected main,
      # never HEAD (refs/pull/N/merge here). Fetch it, and every tag a fresh clone has.
      - name: Fetch protected main and tags for provenance (#1417)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-recurse-submodules --force origin \
            '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse --is-shallow-repository)" = false
          git rev-parse --verify 'refs/remotes/origin/main^{commit}'

      - name: Set up the pinned release SDK (#1548)
        uses: ./.github/actions/setup-release-sdk

      - name: Bootstrap verified Z3 assets
        uses: ./.github/actions/bootstrap-z3

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Assert this project is release-critical in the manifest
        # Guards the matrix against drift: if a project is added to or removed
        # from the manifest's release-critical set without updating this list,
        # the gate would silently stop covering it.
        run: |
          set -euo pipefail
          python3 - "${{ matrix.project }}" <<'PY'
          import json, sys
          project = sys.argv[1]
          manifest = json.load(open("eng/test-manifest.json"))["projects"]
          if not any(p["path"] == project and p["releaseCritical"] for p in manifest):
              sys.exit(f"::error::{project} is not release-critical in eng/test-manifest.json")
          PY

      - name: Run project tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/test
          if [ "${{ matrix.name }}" = "compiler" ]; then
            bash scripts/compiler-shard-filter.sh --self-test
            : > test-output.log
            # Match main CI's fresh-host mitigation for the unresolved #1150 leak.
            for part in 1 2; do
              filter="$(bash scripts/compiler-shard-filter.sh --part "$part")"
              dotnet test "${{ matrix.project }}" -c Release --no-build --no-restore \
                --filter "$filter" \
                --logger "trx;LogFileName=${{ matrix.name }}-$part.trx" \
                --results-directory artifacts/test \
                --verbosity normal 2>&1 | tee -a test-output.log
            done
          else
            dotnet test "${{ matrix.project }}" -c Release \
              --logger "trx;LogFileName=${{ matrix.name }}.trx" \
              --results-directory artifacts/test \
              --verbosity normal 2>&1 | tee test-output.log
          fi

      # --submodules because THIS workflow checks out `submodules: recursive` for
      # every shard (above), unlike test.yml:375 which gives all but `compiler`
      # `submodules: false`. Corpus-gated tests therefore RUN here and SKIP
      # there, so the two checkouts need different skip expectations. Omitting
      # this is what skipped the v0.16.0 publish: run 33568423848 reported
      # "executed 640, expected 639" on a shard where all 640 tests PASSED.
      - name: Enforce test inventory
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "compiler" ]; then
            python3 scripts/check_trx.py \
              --trx "artifacts/test/${{ matrix.name }}-1.trx" \
              --trx "artifacts/test/${{ matrix.name }}-2.trx" \
              --project "${{ matrix.project }}" \
              --submodules
          else
            python3 scripts/check_trx.py \
              --trx "artifacts/test/${{ matrix.name }}.trx" \
              --project "${{ matrix.project }}" \
              --submodules
          fi

      # Assert the property that matters, not a filename: no Z3-gated test may skip on the
      # commit being released. This regression is invisible by construction otherwise —
      # the tests skip rather than fail.
      - name: Assert no Z3-gated test silently skipped
        run: |
          set -euo pipefail
          if grep -q "Z3 not available" test-output.log; then
            echo "::error::Z3-gated tests skipped on the release commit — natives did not reach the test hosts."
            grep -c "Z3 not available" test-output.log
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports-${{ matrix.name }}
          path: artifacts/test/
          retention-days: 90

  sdk-consumer:
    # M-A1: a template consumer restores/builds/tests green against the
    # packaged Calor.Sdk from a local feed (wedge plan v0.11 D-W1.2, PP-A1).
    name: sdk-consumer (${{ matrix.rid }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-15
            rid: osx-arm64
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate }}
          persist-credentials: false

      - name: Set up the pinned release SDK (#1548)
        uses: ./.github/actions/setup-release-sdk

      - name: Bootstrap verified Z3 assets
        uses: ./.github/actions/bootstrap-z3

      - name: Run M-A1 consumer check
        env:
          CALOR_SDK_REQUIRE_ALL_RIDS: "1"
          CALOR_SDK_VERSION: ${{ needs.preflight.outputs.version }}
          CALOR_SDK_EXPECTED_RID: ${{ matrix.rid }}
        run: bash .github/scripts/test-sdk-package.sh

  release-quality:
    needs: preflight
    runs-on: ubuntu-latest
    # Main CI allows 50m; this gate also runs 100 flake trials and the full corpus.
    timeout-minutes: 60

    steps:
      - name: Checkout code and round-trip corpus
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate }}
          persist-credentials: false
          submodules: recursive
          # Keep ledger provenance tests active, as in main CI and release tests
          # (#1159/#1417: they fail in a shallow clone).
          fetch-depth: 0

      # #1417 (v0.24 §6): provenance identities resolve from fetched protected main,
      # never HEAD (refs/pull/N/merge here). Fetch it, and every tag a fresh clone has.
      - name: Fetch protected main and tags for provenance (#1417)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-recurse-submodules --force origin \
            '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse --is-shallow-repository)" = false
          git rev-parse --verify 'refs/remotes/origin/main^{commit}'

      - name: Set up the pinned release SDK (#1548), plus .NET 8 for corpus targets
        uses: ./.github/actions/setup-release-sdk
        with:
          also-install: '8.0.426'

      - name: Bootstrap verified Z3 assets
        uses: ./.github/actions/bootstrap-z3

      - name: Restore and build
        run: |
          dotnet restore --locked-mode
          dotnet build -c Release --no-restore
          dotnet build tests/Calor.Performance.Tests/Calor.Performance.Tests.csproj -c Release

      - name: Run negative gate self-tests
        run: |
          python3 scripts/test_release_checks.py
          python3 scripts/check_test_quality.py --self-test
          python3 scripts/check_trx.py --self-test
          bash scripts/check_sample_ids.sh --self-test
          python3 scripts/check_coverage.py --self-test
          python3 scripts/run_mutation_gate.py --self-test
          python3 scripts/run_performance_gate.py --self-test
          python3 scripts/run_flake_gate.py --self-test
          bash scripts/compiler-shard-filter.sh --self-test

      - name: Check manifest, skips, assertions, and sample IDs
        run: |
          python3 scripts/check_test_quality.py
          bash scripts/check_sample_ids.sh

      - name: Collect and enforce component coverage
        run: |
          set -euo pipefail
          for project in \
            Calor.Compiler.Tests \
            Calor.Conversion.Tests \
            Calor.Enforcement.Tests \
            Calor.Semantics.Tests \
            Calor.Verification.Tests
          do
            if [ "$project" = "Calor.Compiler.Tests" ]; then
              # The coverage checker unions both reports under this shared root.
              for part in 1 2; do
                filter="$(bash scripts/compiler-shard-filter.sh --part "$part")"
                dotnet test "tests/$project/$project.csproj" \
                  -c Release --no-build --no-restore \
                  --filter "$filter" \
                  --collect:"XPlat Code Coverage" \
                  --logger "trx;LogFileName=$project-$part.trx" \
                  --results-directory "artifacts/coverage/raw/$project" \
                  --verbosity quiet
              done
            else
              dotnet test "tests/$project/$project.csproj" \
                -c Release --no-build --no-restore \
                --collect:"XPlat Code Coverage" \
                --logger "trx;LogFileName=$project.trx" \
                --results-directory "artifacts/coverage/raw/$project" \
                --verbosity quiet
            fi
          done
          python3 scripts/check_coverage.py

      - name: Run mutation, performance, and release flake ratchets
        run: |
          python3 scripts/run_mutation_gate.py
          python3 scripts/run_performance_gate.py
          python3 scripts/run_flake_gate.py --runs 100

      - name: Run blocking round-trip verification
        run: |
          dotnet run --project tools/Calor.RoundTrip.Harness/ -c Release -- \
            run --all --dotnet dotnet --output artifacts/migration/roundtrip

      - name: Generate migration scorecard
        run: |
          mkdir -p artifacts/migration
          dotnet run --project tests/Calor.Evaluation -c Release -- \
            scorecard --format both -o artifacts/migration/conversion-scorecard

      - name: Upload release quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-reports
          path: |
            artifacts/coverage/
            artifacts/mutation/
            artifacts/performance/
            artifacts/flake/
            artifacts/migration/
          retention-days: 90

  # The candidate's website, built and scanned before anything is pushed (formerly gate code
  # G012: no claim that the release evidence was independently adjudicated or verified). A dry
  # run runs it too. nextjs-gh-pages.yml rebuilds and rescans the same commit when it deploys.
  site:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout the candidate website
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Check the site serves only self-hosted fonts (#1548)
        run: python3 scripts/check_website_fonts.py --out website/out

      - name: Scan the built site for forbidden wording
        run: python3 scripts/release_checks.py wording website/out

  # Builds and checks the exact bytes to publish. No environment and no id-token: nothing here
  # can obtain a NuGet key. A dry run ends after this job.
  package:
    runs-on: ubuntu-latest
    needs: [preflight, test, sdk-consumer, release-quality, site]
    outputs:
      sums: ${{ steps.bundle.outputs.sums }}
    steps:
      - name: Checkout the candidate with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned release SDK (#1548)
        uses: ./.github/actions/setup-release-sdk

      - name: Require the SDK's own runtime (byte identity, 0.25 re-proof)
        # Roslyn records its host's runtime version in every PDB, and the PDB feeds the deterministic MVID.
        # setup-dotnet also installs the newest LTS runtime into the private install; remove it, so the
        # compiler runs on the runtime SDK 10.0.401 ships with (10.0.12) and nothing newer.
        run: python3 scripts/reproducible_builds.py check-runtime --sdk 10.0.401 --prune

      # #1420: the packed Z3 bytes come from the same owned bootstrap as every test and consumer
      # job above (checksum-pinned upstream archives, verified against
      # .github/z3-binaries-4.15.7.sha256), not from a second download path.
      - name: Bootstrap verified Z3 assets
        uses: ./.github/actions/bootstrap-z3

      - name: Restore dependencies
        run: dotnet restore src/Calor.Compiler/Calor.Compiler.csproj --locked-mode

      - name: Build
        run: dotnet build src/Calor.Compiler/Calor.Compiler.csproj -c Release --no-restore

      # Atomic same-version publish (#787): both packages are packed here, in a job that finishes
      # before any push. The CLI and the SDK ship together or not at all. No version override:
      # the version is Directory.Build.props, which preflight matched to the dispatch input.
      - name: Pack CLI + SDK
        run: |
          set -euo pipefail
          dotnet pack src/Calor.Compiler/Calor.Compiler.csproj -c Release --no-build -o ./nupkg
          dotnet pack src/Calor.Sdk/Calor.Sdk.csproj -c Release -o ./nupkg /p:CalorSdkRequireAllRids=true

      - name: Inspect Calor.Sdk package contents
        run: |
          set -euo pipefail
          SDK_NUPKG=$(ls ./nupkg/Calor.Sdk.*.nupkg)
          bash .github/scripts/inspect-sdk-nupkg.sh "$SDK_NUPKG" --all-rids

      - name: Verify packed Z3 assets against the pins
        run: |
          set -euo pipefail
          python3 scripts/check-packaged-z3.py ./nupkg/calor.*.nupkg --prefix tools/net10.0/any --all-rids
          python3 scripts/check-packaged-z3.py ./nupkg/Calor.Sdk.*.nupkg --prefix tasks/net10.0 --all-rids

      - name: Generate SBOM and provenance
        env:
          CANDIDATE: ${{ needs.preflight.outputs.candidate }}
        run: |
          python3 scripts/generate-release-metadata.py \
            --name "calor-nuget-$CANDIDATE" \
            --artifacts ./nupkg \
            --output ./release-metadata \
            --repository "${{ github.server_url }}/${{ github.repository }}" \
            --commit "$CANDIDATE"

      - name: Render release notes from the candidate CHANGELOG
        env:
          VER: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./release-notes
          python3 scripts/render_release_notes.py "$VER" CHANGELOG.md > ./release-notes/notes.md
          test -s ./release-notes/notes.md

      # Formerly gate code G012: the notes, the package text (nuspec, README), and the metadata
      # must not claim the release evidence was independently adjudicated or verified.
      - name: Scan the notes and packages for forbidden wording
        run: python3 scripts/release_checks.py wording ./release-notes/notes.md ./nupkg/calor.*.nupkg ./nupkg/Calor.Sdk.*.nupkg ./release-metadata

      # --skip-duplicate alone would accept a different package already on nuget.org. An existing
      # version must match the package built here entry by entry (only .signature.p7s may differ).
      # A dry run reports a mismatch as a warning; the publish job repeats this check, never as a
      # warning, immediately before the push.
      - name: Compare any version already on nuget.org
        env:
          VER: ${{ needs.preflight.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/release_checks.py registry --mode existing --version "$VER" --nuget-dir ./nupkg --dry-run "$DRY_RUN"

      - name: Record the bundle
        id: bundle
        env:
          VER: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py bundle --version "$VER" --nuget-dir ./nupkg
          sha256sum ./nupkg/*.nupkg ./release-metadata/*.json ./release-notes/notes.md > SHA256SUMS
          cat SHA256SUMS
          echo "sums=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            ./nupkg/*.nupkg
            ./release-metadata/*.json
            ./release-notes/notes.md
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish:
    runs-on: ubuntu-latest
    needs: [preflight, test, sdk-consumer, release-quality, site, package]
    if: ${{ !inputs.dry_run }}
    # #1545: no NuGet key is stored anywhere. nuget.org Trusted Publishing (policy "calor-release":
    # juanmicrosoft/calor, workflow file publish-nuget.yml, environment nuget-release) exchanges this
    # job's GitHub OIDC token for a one-hour key. nuget.org matches the workflow file NAME and
    # ignores the ref, so the environment is what keeps older tags out: their publish-nuget.yml
    # names no environment, and `nuget-release` admits `main` alone (admin bypass off). That branch
    # rule is a required security control, not a fail-safe: an unrestricted (or auto-recreated)
    # `nuget-release` would still yield a matching environment claim. This is the only job with
    # `id-token: write`. Settings and checklist: https://github.com/juanmicrosoft/calor/blob/d9dbd5a7270aff3a2c3e1efa6f85625f278474aa/release-gaps-0.25/README.md;
    # scripts/check_release_credentials.py --live reports them.
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # Fail closed before any work: the OIDC exchange runs first, so a missing or mismatched
      # nuget.org policy, or a run outside `nuget-release`, stops the job before it attests or
      # pushes. The key lives one hour; the push follows within this job. Both steps are
      # unconditional and never continue-on-error (ReleaseWorkflowTests and
      # check_release_credentials.py check this). `user` is the nuget.org account that owns
      # calor and Calor.Sdk and the policy (not a secret).
      - name: Exchange the GitHub OIDC token for a short-lived NuGet key (#1545)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: juanmicrosoft

      - name: Require the Trusted Publishing NuGet key (#1545)
        env:
          NUGET_OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_OIDC_KEY" ]; then
            echo "::error::nuget.org Trusted Publishing returned no key; check the calor-release policy and the nuget-release environment (#1545)"
            exit 1
          fi

      - name: Checkout the candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate }}
          persist-credentials: false

      - name: Set up the pinned release SDK (#1548)
        uses: ./.github/actions/setup-release-sdk

      # Outside the checkout: nothing in the bundle can replace a script these jobs run.
      - name: Download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle

      # The bundle must be exactly the files the package job recorded, and nothing more.
      - name: Verify the bundle against the package job's record
        env:
          SUMS: ${{ needs.package.outputs.sums }}
          VER: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/release_checks.py verify-bundle --version "$VER" --dir "$RUNNER_TEMP/bundle" --sums-sha256 "$SUMS"

      - name: Attest NuGet packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/bundle/nupkg/*.nupkg
            ${{ runner.temp }}/bundle/release-metadata/*.json

      - name: Compare any version already on nuget.org
        env:
          VER: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/release_checks.py registry --mode existing --version "$VER" --nuget-dir "$RUNNER_TEMP/bundle/nupkg"

      - name: Push to NuGet
        env:
          NUGET_OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$RUNNER_TEMP"/bundle/nupkg/*.nupkg --api-key "$NUGET_OIDC_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # A pre-push 404 followed by a 409 from --skip-duplicate would leave an unverified package
      # in place. Wait (up to 30 minutes) until nuget.org serves both packages, then compare them
      # with the packages built here before anything else is published.
      - name: Verify the packages nuget.org serves
        env:
          VER: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/release_checks.py registry --mode served --version "$VER" --nuget-dir "$RUNNER_TEMP/bundle/nupkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            ${{ runner.temp }}/bundle/nupkg/*.nupkg
            ${{ runner.temp }}/bundle/release-metadata/*.json

  # Install calor from nuget.org as a user would, and require `calor verify` to prove the sample
  # (Proven: 14, Skipped: 0). The sample comes from the candidate commit, not a tag. A failure
  # stops the GitHub release, its metadata, and the website.
  install-check:
    needs: [preflight, publish]
    uses: ./.github/workflows/verify-release.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.candidate }}

  # The GitHub release and its metadata, only after nuget.org serves the verified packages and the
  # installed tool proved the sample. GITHUB_TOKEN can create a release; no NuGet key is here.
  release:
    runs-on: ubuntu-latest
    needs: [preflight, package, publish, install-check]
    permissions:
      contents: write
    steps:
      - name: Checkout the candidate scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate }}
          persist-credentials: false

      # Outside the checkout: nothing in the bundle can replace a script these jobs run.
      - name: Download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle

      - name: Verify the bundle against the package job's record
        env:
          SUMS: ${{ needs.package.outputs.sums }}
          VER: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/release_checks.py verify-bundle --version "$VER" --dir "$RUNNER_TEMP/bundle" --sums-sha256 "$SUMS"

      # The remote tag is checked at this moment, not at checkout time: it must be absent or
      # already point at the candidate. An existing release is accepted only if its title and body
      # are exactly these notes; it is never edited.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          CANDIDATE: ${{ needs.preflight.outputs.candidate }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          # Only a confirmed absence counts as absent; any API failure stops the job.
          remote_tag() {
            local found
            found="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq "[.[] | select(.ref == \"refs/tags/$TAG\")] | length")"
            if [ "$found" = 0 ]; then return 0; fi
            gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha
          }
          existing="$(remote_tag)"
          if [ -n "$existing" ] && [ "$existing" != "$CANDIDATE" ]; then
            echo "::error::tag $TAG already points at $existing, not the candidate $CANDIDATE"; exit 1
          fi
          if gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/existing.md" 2>/dev/null; then
            TITLE="$(gh release view "$TAG" --json name --jq .name)"
            [ "$TITLE" = "$TAG" ] || { echo "::error::existing release $TAG has title '$TITLE'"; exit 1; }
            python3 - "$RUNNER_TEMP/existing.md" "$RUNNER_TEMP/bundle/release-notes/notes.md" <<'PY'
          import sys
          body, notes = (open(p, encoding="utf-8").read().replace("\r\n", "\n").strip() for p in sys.argv[1:])
          if body != notes:
              sys.exit("::error::the existing release has a body other than these notes; a release is never edited")
          PY
          else
            FLAG=""
            if [ "$PRERELEASE" = "true" ]; then FLAG="--prerelease"; fi
            gh release create "$TAG" --target "$CANDIDATE" --title "$TAG" --notes-file "$RUNNER_TEMP/bundle/release-notes/notes.md" $FLAG
          fi
          if [ "$(remote_tag)" != "$CANDIDATE" ]; then
            echo "::error::after release creation tag $TAG does not point at the candidate $CANDIDATE"; exit 1
          fi

      # No --clobber: an asset already attached must be byte-identical to the verified file; a
      # missing one is uploaded; a different one fails. This keeps re-dispatch safe.
      - name: Attach release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          for file in "$RUNNER_TEMP"/bundle/release-metadata/*.json; do
            name="$(basename "$file")"
            if gh release download "$TAG" -p "$name" -D "$RUNNER_TEMP/assets" 2>/dev/null; then
              cmp -s "$file" "$RUNNER_TEMP/assets/$name" || { echo "::error::release asset $name differs from the verified file"; exit 1; }
            else
              gh release upload "$TAG" "$file"
            fi
          done

  # Releases created with GITHUB_TOKEN raise no `release` events, so the website is dispatched
  # explicitly, from main, for the release tag and the candidate commit it must name. #1547:
  # nothing dispatches benchmark publication; that is a separate dispatch of benchmark.yml.
  website:
    runs-on: ubuntu-latest
    needs: [preflight, release]
    permissions:
      actions: write
    steps:
      - name: Dispatch the website deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          CANDIDATE: ${{ needs.preflight.outputs.candidate }}
        run: gh workflow run nextjs-gh-pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG" -f commit="$CANDIDATE"
