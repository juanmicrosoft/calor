name: Publish to NuGet

# #1410 (0.24 R2): this workflow is the only release path. It no longer runs on
# `release: created` and takes no version override. It publishes only the candidate
# named by one successful #1408 adjudication identity, in this order: adjudication
# gate -> release test gates -> NuGet push -> GitHub release -> release metadata ->
# website and benchmark dispatch. The publishing job re-runs
# scripts/verify_release_adjudication.py against the bytes it is about to publish.
# Design: docs/plans/evidence/r2-1410/release-gate.md.
on:
  workflow_dispatch:
    inputs:
      adjudication_identity:
        description: 'calor-adjudication:v1:<adjudication commit>:<terminal record sha256> (#1410)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  Z3_VERSION: "4.15.7"
  ADJUDICATION_IDENTITY: ${{ inputs.adjudication_identity }}

jobs:
  adjudication-gate:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Refuse a dispatch from any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish-nuget runs only from main (got $GITHUB_REF); the candidate comes from the adjudication identity"
          exit 1

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the adjudication identity (#1410)
        id: gate
        run: python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY"

  # Truthful release gates (#790, W1 Slice 4): publishing is impossible unless
  # the full test suite and the M-A1 packaged-SDK consumer check pass on the
  # same commit being published.
  test:
    # One project per runner, mirroring test.yml's matrix.
    #
    # This job previously ran all 13 release-critical projects SEQUENTIALLY on a
    # single runner, and that is what blocked the v0.13.1 publish twice: the
    # first attempt died with `terminate called after throwing 'std::system_error'`
    # (thread/process creation failing under resource exhaustion) and the second
    # took SIGTERM (exit 143) immediately after Calor.Performance.Tests — i.e.
    # entering Calor.RoundTrip.Harness.Tests, which drives full builds and test
    # runs of three external corpus repositories. Neither run came near the
    # 40-minute timeout; the runner simply gave out.
    #
    # test.yml has always sharded these, which is why the same suite passes
    # there. The gate is unchanged in strength — `publish` still needs every leg
    # green on the commit being released — only the packing changes.
    name: test (${{ matrix.name }})
    needs: adjudication-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler
            project: tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          - name: conversion
            project: tests/Calor.Conversion.Tests/Calor.Conversion.Tests.csproj
          - name: enforcement
            project: tests/Calor.Enforcement.Tests/Calor.Enforcement.Tests.csproj
          - name: evaluation
            project: tests/Calor.Evaluation/Calor.Evaluation.csproj
          - name: experimental
            project: tests/Calor.Experimental.Tests/Calor.Experimental.Tests.csproj
          - name: ids
            project: tests/Calor.Ids.Tests/Calor.Ids.Tests.csproj
          - name: il-analysis
            project: tests/Calor.ILAnalysis.Tests/Calor.ILAnalysis.Tests.csproj
          - name: language-server
            project: tests/Calor.LanguageServer.Tests/Calor.LanguageServer.Tests.csproj
          - name: performance
            project: tests/Calor.Performance.Tests/Calor.Performance.Tests.csproj
          - name: roundtrip-harness
            project: tests/Calor.RoundTrip.Harness.Tests/Calor.RoundTrip.Harness.Tests.csproj
          - name: semantics
            project: tests/Calor.Semantics.Tests/Calor.Semantics.Tests.csproj
          - name: tasks
            project: tests/Calor.Tasks.Tests/Calor.Tasks.Tests.csproj
          - name: verification
            project: tests/Calor.Verification.Tests/Calor.Verification.Tests.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.adjudication-gate.outputs.candidate }}
          submodules: recursive
          # #1159: LedgerCommitStampTests decides whether a ledger's MeasuredCommit
          # is reachable, which needs history. Under a depth-1 checkout it SKIPS —
          # and that extra skip put the shard at 5 skips against the manifest's 4,
          # so `Enforce test inventory` failed the release with
          # "executed 8043, expected 8044" and publish-nuget shipped nothing.
          # test.yml already checks out full history for the same reason; the
          # release path is if anything where provenance most wants verifying.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # This is the RELEASE GATE. Without seeding, src/Calor.Compiler/{z3,runtimes}/ are
      # empty at MSBuild evaluation time (they are gitignored), the csproj's
      # `<None Include="runtimes\**\*">` glob matches nothing, the natives never reach the
      # test hosts, and all Z3-backed tests SKIP — so the gate that authorizes shipping
      # to NuGet would go green having verified none of the verification surface. The
      # `publish` job below already stages the natives before restore for this same reason.
      - name: Seed Z3 native libraries (before MSBuild evaluation)
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Assert this project is release-critical in the manifest
        # Guards the matrix against drift: if a project is added to or removed
        # from the manifest's release-critical set without updating this list,
        # the gate would silently stop covering it.
        run: |
          set -euo pipefail
          python3 - "${{ matrix.project }}" <<'PY'
          import json, sys
          project = sys.argv[1]
          manifest = json.load(open("eng/test-manifest.json"))["projects"]
          if not any(p["path"] == project and p["releaseCritical"] for p in manifest):
              sys.exit(f"::error::{project} is not release-critical in eng/test-manifest.json")
          PY

      - name: Run project tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/test
          if [ "${{ matrix.name }}" = "compiler" ]; then
            bash scripts/compiler-shard-filter.sh --self-test
            : > test-output.log
            # Match main CI's fresh-host mitigation for the unresolved #1150 leak.
            for part in 1 2; do
              filter="$(bash scripts/compiler-shard-filter.sh --part "$part")"
              dotnet test "${{ matrix.project }}" -c Release --no-build --no-restore \
                --filter "$filter" \
                --logger "trx;LogFileName=${{ matrix.name }}-$part.trx" \
                --results-directory artifacts/test \
                --verbosity normal 2>&1 | tee -a test-output.log
            done
          else
            dotnet test "${{ matrix.project }}" -c Release \
              --logger "trx;LogFileName=${{ matrix.name }}.trx" \
              --results-directory artifacts/test \
              --verbosity normal 2>&1 | tee test-output.log
          fi

      # --submodules because THIS workflow checks out `submodules: recursive` for
      # every shard (above), unlike test.yml:375 which gives all but `compiler`
      # `submodules: false`. Corpus-gated tests therefore RUN here and SKIP
      # there, so the two checkouts need different skip expectations. Omitting
      # this is what skipped the v0.16.0 publish: run 33568423848 reported
      # "executed 640, expected 639" on a shard where all 640 tests PASSED.
      - name: Enforce test inventory
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "compiler" ]; then
            python3 scripts/check_trx.py \
              --trx "artifacts/test/${{ matrix.name }}-1.trx" \
              --trx "artifacts/test/${{ matrix.name }}-2.trx" \
              --project "${{ matrix.project }}" \
              --submodules
          else
            python3 scripts/check_trx.py \
              --trx "artifacts/test/${{ matrix.name }}.trx" \
              --project "${{ matrix.project }}" \
              --submodules
          fi

      # Assert the property that matters, not a filename: no Z3-gated test may skip on the
      # commit being released. This regression is invisible by construction otherwise —
      # the tests skip rather than fail.
      - name: Assert no Z3-gated test silently skipped
        run: |
          set -euo pipefail
          if grep -q "Z3 not available" test-output.log; then
            echo "::error::Z3-gated tests skipped on the release commit — natives did not reach the test hosts."
            grep -c "Z3 not available" test-output.log
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports-${{ matrix.name }}
          path: artifacts/test/
          retention-days: 90

  sdk-consumer:
    # M-A1: a template consumer restores/builds/tests green against the
    # packaged Calor.Sdk from a local feed (wedge plan v0.11 D-W1.2, PP-A1).
    name: sdk-consumer (${{ matrix.rid }})
    needs: adjudication-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.adjudication-gate.outputs.candidate }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        if: runner.os != 'Windows'
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Bootstrap verified Z3 assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File src/Calor.Compiler/scripts/download-z3.ps1

      - name: Run M-A1 consumer check
        env:
          CALOR_SDK_REQUIRE_ALL_RIDS: "1"
          CALOR_SDK_VERSION: ${{ needs.adjudication-gate.outputs.version }}
          CALOR_SDK_EXPECTED_RID: ${{ matrix.rid }}
        run: bash .github/scripts/test-sdk-package.sh

  release-quality:
    needs: adjudication-gate
    runs-on: ubuntu-latest
    # Main CI allows 50m; this gate also runs 100 flake trials and the full corpus.
    timeout-minutes: 60

    steps:
      - name: Checkout code and round-trip corpus
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.adjudication-gate.outputs.candidate }}
          submodules: recursive
          # Keep ledger provenance tests active, as in main CI and release tests.
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 8 for corpus targets
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Seed Z3 native libraries
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore and build
        run: |
          dotnet restore --locked-mode
          dotnet build -c Release --no-restore
          dotnet build tests/Calor.Performance.Tests/Calor.Performance.Tests.csproj -c Release

      - name: Run negative gate self-tests
        run: |
          python3 scripts/check_test_quality.py --self-test
          python3 scripts/check_trx.py --self-test
          bash scripts/check_sample_ids.sh --self-test
          python3 scripts/check_coverage.py --self-test
          python3 scripts/run_mutation_gate.py --self-test
          python3 scripts/run_performance_gate.py --self-test
          python3 scripts/run_flake_gate.py --self-test
          bash scripts/compiler-shard-filter.sh --self-test

      - name: Check manifest, skips, assertions, and sample IDs
        run: |
          python3 scripts/check_test_quality.py
          bash scripts/check_sample_ids.sh

      - name: Collect and enforce component coverage
        run: |
          set -euo pipefail
          for project in \
            Calor.Compiler.Tests \
            Calor.Conversion.Tests \
            Calor.Enforcement.Tests \
            Calor.Semantics.Tests \
            Calor.Verification.Tests
          do
            if [ "$project" = "Calor.Compiler.Tests" ]; then
              # The coverage checker unions both reports under this shared root.
              for part in 1 2; do
                filter="$(bash scripts/compiler-shard-filter.sh --part "$part")"
                dotnet test "tests/$project/$project.csproj" \
                  -c Release --no-build --no-restore \
                  --filter "$filter" \
                  --collect:"XPlat Code Coverage" \
                  --logger "trx;LogFileName=$project-$part.trx" \
                  --results-directory "artifacts/coverage/raw/$project" \
                  --verbosity quiet
              done
            else
              dotnet test "tests/$project/$project.csproj" \
                -c Release --no-build --no-restore \
                --collect:"XPlat Code Coverage" \
                --logger "trx;LogFileName=$project.trx" \
                --results-directory "artifacts/coverage/raw/$project" \
                --verbosity quiet
            fi
          done
          python3 scripts/check_coverage.py

      - name: Run mutation, performance, and release flake ratchets
        run: |
          python3 scripts/run_mutation_gate.py
          python3 scripts/run_performance_gate.py
          python3 scripts/run_flake_gate.py --runs 100

      - name: Run blocking round-trip verification
        run: |
          dotnet run --project tools/Calor.RoundTrip.Harness/ -c Release -- \
            run --all --dotnet dotnet --output artifacts/migration/roundtrip

      - name: Generate migration scorecard
        run: |
          mkdir -p artifacts/migration
          dotnet run --project tests/Calor.Evaluation -c Release -- \
            scorecard --format both -o artifacts/migration/conversion-scorecard

      - name: Upload release quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-reports
          path: |
            artifacts/coverage/
            artifacts/mutation/
            artifacts/performance/
            artifacts/flake/
            artifacts/migration/
          retention-days: 90

  publish:
    runs-on: ubuntu-latest
    needs: [adjudication-gate, test, sdk-consumer, release-quality]
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write

    steps:
      - name: Checkout the adjudicated candidate with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.adjudication-gate.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Download pre-built Z3 binaries from our z3-binaries release
      - name: Download Z3 binaries
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/z3-binaries-${{ env.Z3_VERSION }}"

          mkdir -p src/Calor.Compiler/z3
          mkdir -p src/Calor.Compiler/runtimes/linux-x64/native
          mkdir -p src/Calor.Compiler/runtimes/linux-arm64/native
          mkdir -p src/Calor.Compiler/runtimes/osx-arm64/native
          mkdir -p src/Calor.Compiler/runtimes/win-x64/native
          mkdir -p src/Calor.Compiler/runtimes/win-arm64/native

          # W1 Slice 2 (#789): fail-closed, checksum-verified downloads. The old
          # bare `curl -L` (no -f, no verification) would have silently packed a
          # 404 HTML page into the shipped nupkg as libz3.
          set -euo pipefail
          MANIFEST=".github/z3-binaries-${{ env.Z3_VERSION }}.sha256"
          if [ ! -s "$MANIFEST" ]; then
            echo "::error::Z3 checksum manifest $MANIFEST is missing or empty — refusing to pack unverified natives"
            exit 1
          fi

          STAGING="$(mktemp -d)"
          # The checksum manifest also tracks the standalone win-x86 Z3 build,
          # but .NET 10 has no x86 SDK, so that asset is verified but not staged
          # into Calor packages.
          ASSETS="Microsoft.Z3.dll libz3-linux-x64.so libz3-linux-arm64.so libz3-osx-arm64.dylib libz3-win-x64.dll libz3-win-x86.dll libz3-win-arm64.dll"
          for asset in $ASSETS; do
            curl -fL -sS --retry 10 --retry-all-errors --retry-max-time 300 -o "$STAGING/$asset" "${RELEASE_URL}/${asset}"
          done

          while read -r hash asset size; do
            test "$(wc -c < "$STAGING/$asset" | tr -d ' ')" = "$size"
          done < <(grep -v '^#' "$MANIFEST" | awk 'NF')
          (cd "$STAGING" && grep -v '^#' "$GITHUB_WORKSPACE/$MANIFEST" | awk 'NF {print $1 "  " $2}' | sha256sum --check --strict -)

          mv "$STAGING/Microsoft.Z3.dll"      src/Calor.Compiler/z3/Microsoft.Z3.dll
          mv "$STAGING/libz3-linux-x64.so"    src/Calor.Compiler/runtimes/linux-x64/native/libz3.so
          mv "$STAGING/libz3-linux-arm64.so"  src/Calor.Compiler/runtimes/linux-arm64/native/libz3.so
          mv "$STAGING/libz3-osx-arm64.dylib" src/Calor.Compiler/runtimes/osx-arm64/native/libz3.dylib
          mv "$STAGING/libz3-win-x64.dll"     src/Calor.Compiler/runtimes/win-x64/native/libz3.dll
          mv "$STAGING/libz3-win-arm64.dll"   src/Calor.Compiler/runtimes/win-arm64/native/libz3.dll

          echo "Downloaded and checksum-verified Z3 binaries:"
          find src/Calor.Compiler/z3 src/Calor.Compiler/runtimes -type f -ls

      - name: Restore dependencies
        run: dotnet restore src/Calor.Compiler/Calor.Compiler.csproj --locked-mode

      - name: Build
        run: dotnet build src/Calor.Compiler/Calor.Compiler.csproj -c Release --no-restore

      # Atomic same-version publish (#787): pack BOTH packages first, push only
      # after both packed successfully — the CLI and the SDK ship together or
      # not at all.
      - name: Pack CLI + SDK
        run: |
          set -euo pipefail
          # No version override (#1410): the version is the candidate's Directory.Build.props,
          # which the gate has already matched to the adjudicated version.
          dotnet pack src/Calor.Compiler/Calor.Compiler.csproj -c Release --no-build -o ./nupkg
          dotnet pack src/Calor.Sdk/Calor.Sdk.csproj -c Release -o ./nupkg /p:CalorSdkRequireAllRids=true

      - name: Inspect Calor.Sdk package contents
        run: |
          set -euo pipefail
          SDK_NUPKG=$(ls ./nupkg/Calor.Sdk.*.nupkg)
          bash .github/scripts/inspect-sdk-nupkg.sh "$SDK_NUPKG" --all-rids

      - name: Generate SBOM and provenance
        run: |
          python3 scripts/generate-release-metadata.py \
            --name "calor-nuget-${{ needs.adjudication-gate.outputs.candidate }}" \
            --artifacts ./nupkg \
            --output ./release-metadata \
            --repository "${{ github.server_url }}/${{ github.repository }}" \
            --commit "${{ needs.adjudication-gate.outputs.candidate }}"

      # The gate re-runs here, in the job that publishes, against the exact packages,
      # metadata, and notes it is about to publish, before anything is attested or pushed.
      - name: Render release notes from the candidate CHANGELOG
        env:
          VER: ${{ needs.adjudication-gate.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; print; next} f && /^## \[/ {exit} f' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Verify packages, metadata, and notes against the adjudication (#1410)
        env:
          VER: ${{ needs.adjudication-gate.outputs.version }}
        run: |
          python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY" \
            --expect-head --version "$VER" --nuget-dir ./nupkg --metadata-dir ./release-metadata \
            --release-notes "$RUNNER_TEMP/notes.md"

      - name: Attest NuGet packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ./nupkg/*.nupkg
            ./release-metadata/*.json

      # --skip-duplicate alone would accept a different package already on nuget.org. An
      # existing version is downloaded and must match the adjudicated package entry for
      # entry (only the repository signature may differ).
      - name: Compare any version already on nuget.org (#1410)
        env:
          VER: ${{ needs.adjudication-gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/registry"
          for id in calor calor.sdk; do
            url="https://api.nuget.org/v3-flatcontainer/$id/$VER/$id.$VER.nupkg"
            code="$(curl -sS -L -o "$RUNNER_TEMP/registry/$id.$VER.nupkg" -w '%{http_code}' "$url")"
            case "$code" in
              200) echo "nuget.org already has $id $VER; comparing" ;;
              404) rm -f "$RUNNER_TEMP/registry/$id.$VER.nupkg" ;;
              *) echo "::error::cannot tell whether nuget.org has $id $VER (HTTP $code)"; exit 1 ;;
            esac
          done
          python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY" \
            --expect-head --version "$VER" --nuget-dir ./nupkg --registry-dir "$RUNNER_TEMP/registry"

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # A pre-push 404 followed by a 409 from --skip-duplicate would leave an unverified
      # package in place. Wait until nuget.org serves both packages, then compare them with
      # the adjudicated packages before anything else is published.
      - name: Verify the packages nuget.org serves (#1410)
        env:
          VER: ${{ needs.adjudication-gate.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/served" && mkdir -p "$RUNNER_TEMP/served"
          for id in calor calor.sdk; do
            url="https://api.nuget.org/v3-flatcontainer/$id/$VER/$id.$VER.nupkg"
            for attempt in $(seq 1 60); do
              code="$(curl -sS -L -o "$RUNNER_TEMP/served/$id.$VER.nupkg" -w '%{http_code}' "$url" || echo 000)"
              [ "$code" = 200 ] && break
              rm -f "$RUNNER_TEMP/served/$id.$VER.nupkg"
              sleep 30
            done
            test -s "$RUNNER_TEMP/served/$id.$VER.nupkg" || { echo "::error::nuget.org does not serve $id $VER after 30 minutes"; exit 1; }
          done
          python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY" \
            --expect-head --version "$VER" --nuget-dir ./nupkg --registry-dir "$RUNNER_TEMP/served"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            ./nupkg/*.nupkg
            ./release-metadata/*.json

      # The GitHub release is created only here: after adjudication and after the packages
      # are on nuget.org. Its body is the adjudicated notes plus the identity trailer that
      # every downstream surface checks. The remote tag is checked at this moment, not at
      # checkout time: it must be absent or already point at the candidate. An existing
      # release is accepted only if its body verifies; it is never edited.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.adjudication-gate.outputs.tag }}
          CANDIDATE: ${{ needs.adjudication-gate.outputs.candidate }}
          PRERELEASE: ${{ needs.adjudication-gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          # Only a confirmed absence counts as absent; any API failure stops the job.
          remote_tag() {
            local found
            found="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq "[.[] | select(.ref == \"refs/tags/$TAG\")] | length")"
            if [ "$found" = 0 ]; then return 0; fi
            gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha
          }
          existing="$(remote_tag)"
          if [ -n "$existing" ] && [ "$existing" != "$CANDIDATE" ]; then
            echo "::error::tag $TAG already points at $existing, not the candidate $CANDIDATE"; exit 1
          fi
          if gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/existing.md" 2>/dev/null; then
            TITLE="$(gh release view "$TAG" --json name --jq .name)"
            python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY" \
              --expect-head --release-body "$RUNNER_TEMP/existing.md" --release-tag "$TAG" --release-title "$TITLE"
          else
            { cat "$RUNNER_TEMP/notes.md"; printf '\n<!-- calor-adjudication: %s -->\n' "$ADJUDICATION_IDENTITY"; } > "$RUNNER_TEMP/body.md"
            FLAG=""
            if [ "$PRERELEASE" = "true" ]; then FLAG="--prerelease"; fi
            gh release create "$TAG" --target "$CANDIDATE" --title "$TAG" --notes-file "$RUNNER_TEMP/body.md" $FLAG
          fi
          if [ "$(remote_tag)" != "$CANDIDATE" ]; then
            echo "::error::after release creation tag $TAG does not point at the candidate $CANDIDATE"; exit 1
          fi

      # No --clobber (#1410): an asset already attached must be byte-identical to the verified
      # file; a missing one is uploaded; a different one fails. This keeps re-dispatch safe.
      - name: Attach release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.adjudication-gate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          for file in ./release-metadata/*.json; do
            name="$(basename "$file")"
            if gh release download "$TAG" -p "$name" -D "$RUNNER_TEMP/assets" 2>/dev/null; then
              cmp -s "$file" "$RUNNER_TEMP/assets/$name" || { echo "::error::release asset $name differs from the verified file"; exit 1; }
            else
              gh release upload "$TAG" "$file"
            fi
          done

      # Releases created with GITHUB_TOKEN raise no `release` events, so the downstream
      # surfaces are dispatched explicitly, from main, with the same identity. Each one
      # re-runs the gate, checks out the candidate, and checks this release's body.
      - name: Dispatch website and benchmark publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nextjs-gh-pages.yml --ref main -f adjudication_identity="$ADJUDICATION_IDENTITY"
          gh workflow run benchmark.yml --ref main -f adjudication_identity="$ADJUDICATION_IDENTITY"
