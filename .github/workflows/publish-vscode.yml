name: Publish VS Code Extension

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: windows-latest
            target: win32-arm64
          - os: macos-latest
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Language Server
        run: |
          cd editors/vscode
          chmod +x scripts/build-server.sh
          ./scripts/build-server.sh ${{ matrix.target }}
        shell: bash

      - name: Ensure server is executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x editors/vscode/server/calor-lsp
        shell: bash

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: cd editors/vscode && npm ci

      - name: Update version (if specified)
        if: ${{ github.event.inputs.version != '' }}
        working-directory: editors/vscode
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Compile TypeScript
        run: |
          cd editors/vscode
          npm run compile

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: |
          cd editors/vscode
          vsce package --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calor-${{ matrix.target }}
          path: editors/vscode/*.vsix

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: vsix-packages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every target is attempted, then the step fails if any of them failed.
      # The previous loop ran under `bash -e` with no error handling, so the
      # FIRST failing target aborted the step and the remaining platforms were
      # never published — turning a one-platform problem into a silent partial
      # release. That matters most on a retry: once one target has published,
      # re-running would abort on its "already exists" error and strand the rest.
      # An already-published target is therefore treated as success, which also
      # makes the whole step idempotent and safe to re-run.
      - name: Publish all platforms
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npm install -g @vscode/vsce

          shopt -s nullglob globstar
          vsixes=(vsix-packages/**/*.vsix)
          if [ ${#vsixes[@]} -eq 0 ]; then
            echo "::error::no .vsix files found under vsix-packages/ — the build job produced nothing to publish"
            exit 1
          fi
          echo "Found ${#vsixes[@]} VSIX package(s) to publish."

          failed=()
          for vsix in "${vsixes[@]}"; do
            echo "::group::Publishing $vsix"
            if out="$(vsce publish --packagePath "$vsix" -p "$VSCE_PAT" 2>&1)"; then
              echo "$out"
              echo "published: $vsix"
            elif grep -qiE 'already exists|already published' <<<"$out"; then
              echo "$out"
              echo "already published, treating as success: $vsix"
            else
              echo "$out"
              echo "::error::failed to publish $vsix"
              failed+=("$vsix")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} of ${#vsixes[@]} target(s) failed to publish:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All ${#vsixes[@]} target(s) published."

      - name: Upload all VSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-all-platforms
          path: vsix-packages/**/*.vsix
