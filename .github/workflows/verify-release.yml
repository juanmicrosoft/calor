name: Verify Release (installed tool)

# End-to-end check of a shipped release: install the `calor` tool from nuget.org as a downstream
# consumer would, then require the Z3 verifier to prove a known sample (Proven: 14, Skipped: 0).
# publish-nuget.yml calls this after the push and before it creates the GitHub release, so a
# failure here stops the release, its metadata, and the website (#1582). It can also be dispatched by hand for any shipped version, e.g.
# from environments that cannot reach api.nuget.org directly.
#
# Independent of publish-nuget.yml's sdk-consumer matrix: that one exercises Calor.Sdk (MSBuild
# integration) through a local feed built during the publish run. This one exercises the `calor`
# global tool through the public nuget.org feed, which is what a user actually types.

on:
  workflow_call:
    inputs:
      version:
        description: 'Package version to verify (e.g. 0.26.0)'
        required: true
        type: string
      ref:
        description: 'Commit or tag to take the sample from (default: v<version>)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to verify (e.g. 0.26.0)'
        required: true
        type: string
      ref:
        description: 'Commit or tag to take the sample from (default: v<version>)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  install-and-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.runner }}
    name: install-and-verify (${{ matrix.rid }})

    steps:
      - name: Checkout the workflow's actions
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      # The sample comes from `ref` (publish-nuget passes the candidate commit) or the release tag.
      - name: Checkout the sample
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}
          path: release
          persist-credentials: false
          sparse-checkout: samples/Verification

      - name: Set up the pinned release SDK (#1548)
        uses: ./.github/actions/setup-release-sdk

      # nuget.org can serve the package file before every endpoint `dotnet tool install` reads
      # has caught up, so the install is retried for up to 30 minutes.
      - name: Install calor ${{ inputs.version }} from nuget.org
        shell: bash
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid version"; exit 1; }
          # Explicit --add-source pins the install to nuget.org and bypasses any user/machine
          # nuget.config that would route through a mirror. A fresh --tool-path per attempt, so
          # a stale install can't mask a real 'not found'.
          for attempt in $(seq 1 30); do
            rm -rf "$RUNNER_TEMP/calorcheck"
            if dotnet tool install --tool-path "$RUNNER_TEMP/calorcheck" calor --version "$VER" \
                --add-source https://api.nuget.org/v3/index.json; then
              exit 0
            fi
            echo "attempt $attempt: calor $VER is not installable yet"
            sleep 60
          done
          echo "::error::calor $VER could not be installed from nuget.org after 30 attempts"
          exit 1

      - name: Print installed version
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/calorcheck/calor" --version

      - name: Verify proven-contracts sample
        shell: bash
        run: |
          set -euo pipefail
          OUT="$("$RUNNER_TEMP/calorcheck/calor" verify release/samples/Verification/proven-contracts.calr)"
          echo "$OUT"
          # Guard against a shipped-but-broken Z3 that reports Calor0710 ("Static contract
          # verification skipped: Z3 SMT solver is not available"): those cases print Skipped>0
          # and exit nonzero. The proven sample must land Proven: 14, Skipped: 0. \s+ because
          # the CLI aligns numbers with padding, e.g. "  Proven:      14".
          echo "$OUT" | grep -Eq "Proven:\s+14\b"
          echo "$OUT" | grep -Eq "Skipped:\s+0\b"
