name: Verify Release (installed tool)

# On-demand end-to-end verification of a shipped release: install the `calor`
# tool from nuget.org as a downstream consumer would, then exercise the Z3
# verifier against a known-proven sample. Mirrors the manual check the
# create-release skill spells out ("dotnet tool install --tool-path
# /tmp/calorcheck calor --version $VER && calor verify …"), so releases can be
# formally verified from environments where developers cannot reach
# api.nuget.org directly (e.g. corporate proxies that mirror nuget.org with
# lag and reject non-mirrored source overrides).
#
# Independent of publish-nuget.yml's sdk-consumer matrix: that one exercises
# Calor.Sdk (MSBuild integration) via a local feed built during the publish
# run. This one exercises the `calor` global tool via the public nuget.org
# feed, which is what a user actually types after a release lands.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to verify (e.g. 0.14.0)'
        required: true
        type: string
      adjudication_identity:
        description: 'calor-adjudication:v1:<adjudication commit>:<terminal record sha256> (#1410). Exactly one of this and maintainer_override.'
        required: false
        type: string
      maintainer_override:
        description: 'For the UNGATED 0.24.0 maintainer-override release only: the same version as above'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # #1410 (0.24 R2): the installed-tool check is a release-path surface, so it also
  # consumes the one adjudication identity. It verifies only the adjudicated version,
  # and only after the GitHub release carrying that identity exists. A maintainer-override
  # release (0.24.0) carries no identity; it is checked against its override record instead.
  adjudication-gate:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.gate.outputs.candidate }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the adjudication identity and the GitHub release (#1410)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ADJUDICATION_IDENTITY: ${{ inputs.adjudication_identity }}
          MAINTAINER_OVERRIDE: ${{ inputs.maintainer_override }}
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::dispatch from main only (got $GITHUB_REF)"; exit 1; fi
          gh release view "v$VER" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          TITLE="$(gh release view "v$VER" --json name --jq .name)"
          MODE="$(python3 scripts/verify_maintainer_override.py --select-mode --github-output '' \
            --identity "$ADJUDICATION_IDENTITY" --override "$MAINTAINER_OVERRIDE" | sed -n 's/^mode=//p')"
          case "$MODE" in
            identity)
              python3 scripts/verify_release_adjudication.py --identity "$ADJUDICATION_IDENTITY" \
                --version "$VER" --require-tag --release-body "$RUNNER_TEMP/release-body.md" \
                --release-tag "v$VER" --release-title "$TITLE" ;;
            override)
              if [ "$MAINTAINER_OVERRIDE" != "$VER" ]; then echo "::error::maintainer_override must equal version"; exit 1; fi
              python3 scripts/verify_maintainer_override.py --override "$MAINTAINER_OVERRIDE" \
                --identity "$ADJUDICATION_IDENTITY" --candidate-tag --require-tag \
                --release-body "$RUNNER_TEMP/release-body.md" --release-tag "v$VER" --release-title "$TITLE" ;;
            *) echo "::error::release mode could not be chosen"; exit 1 ;;
          esac

  install-and-verify:
    needs: adjudication-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-14
            rid: osx-arm64
          - runner: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.runner }}
    name: install-and-verify (${{ matrix.rid }})

    steps:
      - name: Checkout sample
        uses: actions/checkout@v4
        with:
          # Only need samples/Verification/proven-contracts.calr for the check.
          # Sparse-checkout keeps the runner light and avoids submodule cost.
          # The sample comes from the adjudicated candidate, not the dispatch ref (#1410).
          ref: ${{ needs.adjudication-gate.outputs.candidate }}
          sparse-checkout: |
            samples/Verification

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install calor ${{ inputs.version }} from nuget.org
        shell: bash
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Explicit --add-source pins the install to nuget.org and bypasses
          # any user/machine nuget.config that would route through a mirror.
          # Fresh --tool-path per run so a stale install can't mask a real
          # 'not found' — matches the create-release skill's guidance.
          rm -rf "$RUNNER_TEMP/calorcheck"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid version"; exit 1; }
          dotnet tool install \
            --tool-path "$RUNNER_TEMP/calorcheck" \
            calor \
            --version "$VER" \
            --add-source https://api.nuget.org/v3/index.json

      - name: Print installed version
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/calorcheck/calor" --version

      - name: Verify proven-contracts sample
        shell: bash
        run: |
          set -euo pipefail
          OUT="$("$RUNNER_TEMP/calorcheck/calor" verify samples/Verification/proven-contracts.calr)"
          echo "$OUT"
          # Guard against a shipped-but-broken Z3 that reports Calor0710
          # ("Static contract verification skipped: Z3 SMT solver is not
          # available") — those cases print Skipped>0 and non-zero exit.
          # The proven sample must land Proven: 14, Skipped: 0.
          # Use \s+ (any whitespace run) in the pattern because the CLI
          # aligns numbers with padding, e.g. "  Proven:      14".
          echo "$OUT" | grep -Eq "Proven:\s+14\b"
          echo "$OUT" | grep -Eq "Skipped:\s+0\b"
