name: Performance Tests

# Test-manifest honesty (#790, W1 Slice 4): tests/Calor.Performance.Tests was
# in no workflow at all — an unwired suite is an untruthful manifest. It runs
# here nightly (plus on demand) rather than per-PR because its assertions are
# wall-clock thresholds; on shared runners those are load-sensitive, and a
# flaky per-PR gate trains people to ignore red. A red nightly run is a real
# signal and should be investigated, not re-run into silence.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      profile_compiler_memory:
        description: Profile the unsplit compiler host instead of running timing gates (#1590)
        type: boolean
        default: false

jobs:
  performance:
    if: ${{ inputs.profile_compiler_memory != true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        uses: ./.github/actions/bootstrap-z3

      - name: Build performance tests
        run: dotnet build tests/Calor.Performance.Tests/Calor.Performance.Tests.csproj -c Release

      - name: Test performance gate fails closed
        run: python3 scripts/run_performance_gate.py --self-test

      - name: Run noise-controlled performance gate
        run: python3 scripts/run_performance_gate.py

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: artifacts/performance/
          retention-days: 90

  compiler-memory-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.profile_compiler_memory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: ./.github/actions/bootstrap-z3
      - name: Install native allocation profiler
        run: |
          if ! command -v heaptrack; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends heaptrack
          fi
      - name: Build compiler tests
        id: build
        run: dotnet build tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj -c Release
      - name: Profile one unsplit test host
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p artifacts/compiler-memory
          export CALOR_PROFILE_DOTNET="$(command -v dotnet)"
          export CALOR_PROFILE_OUTPUT="$PWD/artifacts/compiler-memory"
          chmod +x scripts/profile-compiler-testhost.sh
          bash scripts/runner-resource-sampler.sh 10 > >(tee artifacts/compiler-memory/resources.log) 2>&1 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          # Runsettings names are case-sensitive; prove native and managed
          # symbol capture before spending the full profiling budget.
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj \
            -c Release --no-build --no-restore \
            --filter "FullyQualifiedName~CliTestHarnessTests" \
            --verbosity quiet \
            -- RunConfiguration.DotNetHostPath="$PWD/scripts/profile-compiler-testhost.sh"
          if ! compgen -G "$CALOR_PROFILE_OUTPUT/heaptrack.*" > /dev/null ||
             ! compgen -G "/tmp/perf-*.map" > /dev/null; then
            echo "::error::VSTest did not produce native profiling and managed symbol smoke traces."
            exit 1
          fi
          # Stop the diagnostic process before runner exhaustion prevents all
          # artifact steps. A timeout is a failed, partial probe, never a pass.
          timeout --signal=INT --kill-after=30s 5m \
            dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj \
            -c Release --no-build --no-restore \
            --logger "trx;LogFileName=unsplit.trx" \
            --results-directory artifacts/compiler-memory \
            --verbosity normal \
            -- RunConfiguration.DotNetHostPath="$PWD/scripts/profile-compiler-testhost.sh" \
            2>&1 | tee artifacts/compiler-memory/tests.log
      - name: Preserve managed JIT symbol maps
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          maps=(/tmp/perf-*.map /tmp/perfinfo-*.map)
          test "${#maps[@]}" -gt 0
          cp "${maps[@]}" artifacts/compiler-memory/
      - name: Summarize native allocation stacks
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          profiles=(artifacts/compiler-memory/heaptrack.*.gz artifacts/compiler-memory/heaptrack.*.zst)
          test "${#profiles[@]}" -gt 0
          for profile in "${profiles[@]}"; do
            heaptrack_print "$profile" > "$profile.txt"
          done
      - name: Upload native allocation profiles and resource trajectory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-memory-profile
          path: artifacts/compiler-memory/
          if-no-files-found: error
          retention-days: 30
      - name: Verify the full unsplit inventory without profiler overhead
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p artifacts/compiler-memory/unsplit-verification
          bash scripts/runner-resource-sampler.sh 10 > >(tee artifacts/compiler-memory/unsplit-verification/resources.log) 2>&1 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj \
            -c Release --no-build --no-restore \
            --logger "trx;LogFileName=unsplit-verification.trx" \
            --results-directory artifacts/compiler-memory/unsplit-verification \
            --verbosity normal \
            2>&1 | tee artifacts/compiler-memory/unsplit-verification/tests.log
          python3 scripts/check_trx.py \
            --trx-dir artifacts/compiler-memory/unsplit-verification \
            --project tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
      - name: Upload full unsplit verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-unsplit-verification
          path: artifacts/compiler-memory/unsplit-verification/
          if-no-files-found: error
          retention-days: 30
