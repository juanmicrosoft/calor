name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  calor-first-guard:
    # Lifecycle hooks are useful guidance, but specialized Codex tool paths
    # can bypass them. This diff gate is the repository-level backstop.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Calor-first guard behavior
        run: bash scripts/check-calor-first-diff-tests.sh

      - name: Reject unapproved C# alongside Calor source
        env:
          CALOR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-calor-first-diff.sh

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # #762 B2 (review Major 2): the F-2 conversion-leg ratchet
          # (BinderIncompleteRatchetTests.ConversionLeg_*) skips without the corpus
          # submodules — without this, leg 2's equality ratchet is enforced NOWHERE
          # in CI and a converter/binder regression moving its counts fails no pipeline.
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # src/Calor.Compiler/{z3,runtimes}/ are gitignored, so on a fresh checkout the
      # csproj's `<None Include="runtimes\**\*" CopyToOutputDirectory>` glob — resolved at
      # MSBuild EVALUATION time — matches nothing, and the natives never propagate to test
      # projects. The DownloadZ3 target populates those directories later, at EXECUTION
      # time, which is too late for the glob. The managed Microsoft.Z3.dll still flows via
      # <Reference Private="true">, so the wrapper loads and dies at P/Invoke, and every
      # Z3-backed test silently skips. Seeding before restore fixes the ordering.
      - name: Seed Z3 native libraries (before MSBuild evaluation)
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run lossless formatter safety gate
        run: |
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~LosslessFormattingTests|FullyQualifiedName~ConvertFormatEnvelopeTests.Lint|FullyQualifiedName~Mcp.FormatToolTests" \
            --verbosity normal
          dotnet test tests/Calor.LanguageServer.Tests/Calor.LanguageServer.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~FormattingHandlerTests" \
            --verbosity normal

      - name: Run exact-span LSP refactoring gate
        run: >-
          dotnet test tests/Calor.LanguageServer.Tests/Calor.LanguageServer.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~ExactSpanRefactoringGateTests|FullyQualifiedName~RenameHandlerTests"
          --verbosity normal

      - name: Run full-vs-incremental identity gate
        run: >-
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~EditScriptIdentityTests"
          --verbosity normal

      - name: Run rename gate
        run: >-
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~RenameHarnessTests"
          --verbosity normal

      - name: Run all tests
        run: |
          set -euo pipefail
          dotnet test -c Release --no-build --verbosity normal 2>&1 | tee test-output.log

      # Assert the PROPERTY that matters (no Z3-gated test skipped), not the presence of a
      # filename. An earlier version of this step checked only that some libz3.so existed
      # anywhere under bin/Release, which would pass on a wrong-RID copy that cannot load,
      # and could not detect a present-but-unloadable native (e.g. a glibc bump on the
      # runner). This check fails in all of those cases. Without it the regression is
      # invisible by construction: the tests skip rather than fail.
      - name: Assert no Z3-gated test silently skipped
        run: |
          set -euo pipefail
          if grep -q "Z3 not available" test-output.log; then
            echo "::error::Z3-gated tests skipped — natives did not reach the test hosts."
            grep -c "Z3 not available" test-output.log
            exit 1
          fi

      # F-4 / #779: generated solver-vs-runtime differential. This blocking Fact
      # fails rather than skips when Z3 is unavailable. It verifies the frozen
      # modeled-form denominator across §Q, §S and §PROOF, depths 1..3 and both
      # polarities, executes guard-forced generated C#, and byte-checks reports.
      - name: Run verifier-runtime differential gate
        run: >-
          dotnet test tests/Calor.Verification.Tests/Calor.Verification.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~VerifierRuntimeDifferentialTests.CommittedReportsMatchGeneratedOracle"
          --verbosity normal

      - name: Upload verifier-runtime differential metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-runtime-differential
          path: |
            bench/phase0-agent-native/verifier-runtime-differential.json
            bench/phase0-agent-native/verifier-runtime-differential.md
          retention-days: 30

      # Spec drift (Phase 1 item 6, agent-native strategy): agent-facing docs
      # are machine-checked against the implementation, reusing this job's
      # build. Covered files: CLAUDE.md, every docs/syntax-reference/*.md, and
      # every docs/cli/*.md (plus docs/**/*.md for the version scan). Checks:
      # documented §-keywords exist in the lexer, cited CalorNNNN codes exist
      # (and cited bands are non-empty), the effect table in
      # docs/syntax-reference/effects.md matches the effect registry in both
      # directions, the Calor13xx table in docs/cli/structured-output.md is
      # complete, no doc hardcodes the current version, and every fenced
      # ```calor example declaring a complete program (starts with §M) still
      # parses with the current compiler.
      - name: Check agent-facing docs against the implementation (spec drift)
        run: dotnet run --project src/Calor.Compiler -c Release --no-build -- self-check docs

  enforcement-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # See the note in the `test` job: seed before restore or the natives never reach
      # the test hosts and every Z3-backed test skips. This job runs Calor.Compiler.Tests.
      - name: Seed Z3 native libraries (before MSBuild evaluation)
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run enforcement tests
        run: dotnet test tests/Calor.Enforcement.Tests -c Release --no-build --verbosity detailed

      - name: Run regression tests
        run: |
          set -euo pipefail
          dotnet test tests/Calor.Compiler.Tests -c Release --no-build --verbosity normal 2>&1 | tee test-output.log
          dotnet test tests/Calor.Evaluation -c Release --no-build --verbosity normal

      # This job runs Calor.Compiler.Tests, which carries 44 Z3-gated tests. Same guard as
      # the `test` job — a skip here would otherwise be silent.
      - name: Assert no Z3-gated test silently skipped
        run: |
          set -euo pipefail
          if grep -q "Z3 not available" test-output.log; then
            echo "::error::Z3-gated tests skipped — natives did not reach the test hosts."
            grep -c "Z3 not available" test-output.log
            exit 1
          fi

  ds15-fixtures:
    # PP-S4's instrument (A-1.5.7; roadmap v0.13 §2.5 gate 6): every SupportLevel
    # promotion toward Full and every net ConversionLossKind removal must carry a
    # registered fixture. The script's --self-test runs FIRST on every invocation,
    # so the gate is demonstrated to fail on a fixture-less promotion continuously,
    # not once (the discriminating pin, per pins-must-discriminate).
    # Job ID cannot contain dots (GitHub Actions rejects the whole workflow file);
    # the display name below carries the A-1.5.7 frozen entry-point name and is what
    # status contexts show.
    name: d-s1.5-fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test (discriminating pin)
        run: bash scripts/check-d-s1.5-fixtures.sh --self-test

      - name: Check promotions and loss-kind removals against the registry
        env:
          CALOR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="${CALOR_BASE_SHA:-}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          # merge-base: the precise span for PR events (payload base.sha is the base
          # branch at PR creation and can span unrelated main commits).
          BASE=$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")
          bash scripts/check-d-s1.5-fixtures.sh "$BASE" HEAD

      - name: Detect registered fixtures
        id: fixtures
        run: |
          if ls bench/phase0-agent-native/fixtures/d-s1.5/*/fixture.json >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.fixtures.outputs.present == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate registered fixtures (indeterminate = failing)
        if: steps.fixtures.outputs.present == 'true'
        run: |
          dotnet test tests/Calor.Conversion.Tests -c Release \
            --filter "FullyQualifiedName~DS15FixtureRegistry" --verbosity detailed

  semantics-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run semantics tests
        run: dotnet test tests/Calor.Semantics.Tests -c Release --no-build --verbosity detailed

  conversion-scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run scorecard tests
        run: >-
          dotnet test tests/Calor.Evaluation -c Release --no-build
          --filter "FullyQualifiedName~ConversionScorecardTests"
          --verbosity normal

      - name: Generate scorecard report
        run: >-
          dotnet run --project tests/Calor.Evaluation -c Release --
          scorecard --format both -o conversion-scorecard

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-scorecard
          path: |
            conversion-scorecard.json
            conversion-scorecard.md

      - name: Post PR comment with scorecard
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('conversion-scorecard.md', 'utf8');
            const marker = '<!-- calor-conversion-scorecard -->';
            const body = `${marker}\n${md}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Check for regressions against baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const current = JSON.parse(fs.readFileSync('conversion-scorecard.json', 'utf8'));

            // Load committed baseline
            const baselinePath = 'tests/Calor.Evaluation/Scorecard/baseline.json';
            if (!fs.existsSync(baselinePath)) {
              core.warning('No baseline.json found — skipping regression check');
              return;
            }
            const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));

            // Compare round-trip counts
            const baselineRt = baseline.roundTripPassing;
            const currentRt = current.roundTripPassing;
            const delta = currentRt - baselineRt;

            core.info(`Baseline round-trip: ${baselineRt}/${baseline.total}`);
            core.info(`Current round-trip:  ${currentRt}/${current.total}`);
            core.info(`Delta: ${delta >= 0 ? '+' : ''}${delta}`);

            // Detect per-snippet regressions
            const baselineById = {};
            for (const r of baseline.results) baselineById[r.id] = r;

            const regressions = [];
            for (const r of current.results) {
              const b = baselineById[r.id];
              if (!b) continue;
              // W1 Slice 3: roslynParseSuccess split into cSharpSyntaxSuccess +
              // cSharpCompilationSuccess — reading the old field would be
              // undefined and silently fail-open (no regression ever flagged).
              const bPass = b.conversionSuccess && b.compilationSuccess && b.cSharpSyntaxSuccess && b.cSharpCompilationSuccess;
              const cPass = r.conversionSuccess && r.compilationSuccess && r.cSharpSyntaxSuccess && r.cSharpCompilationSuccess;
              if (bPass && !cPass) regressions.push(r.id);
            }

            if (regressions.length > 0) {
              core.setFailed(`Conversion regressions detected in snippets: ${regressions.join(', ')}`);
            } else if (currentRt < baselineRt) {
              core.setFailed(`Round-trip count dropped: ${baselineRt} → ${currentRt}`);
            } else {
              core.info('No regressions detected');
            }

  roundtrip-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: conversion-scorecard
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # The corpus (MediatR/Serilog/FluentValidation) is vendored as SHA-pinned git
      # submodules under bench/corpus/ (D-W4.2). This job needs them, so it checks out
      # with submodules — the MAIN build/test jobs above do NOT (the corpus is
      # benchmark infra, not a build dependency; the Calor solution builds and tests
      # without it).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10 (for Calor build + net10 corpus targets)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 8 (MediatR/FluentValidation tests run on net8.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # PRECAUTIONARY, not currently load-bearing — stated honestly because an earlier
      # version of this comment was wrong. This job runs `harness run --all`, which routes
      # to RoundTripPipeline and touches no Z3; the Z3-backed addressability probe
      # (VerificationAddressability) is reachable only from the `gen-tasks` command, and its
      # tests run in the `test` job. Verified: with and without this step the job's output is
      # byte-identical. Kept so that adding `gen-tasks` here cannot silently degrade.
      - name: Seed Z3 native libraries (before MSBuild evaluation)
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore and build Calor
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run round-trip verification
        continue-on-error: true
        run: |
          dotnet run --project tools/Calor.RoundTrip.Harness/ -c Release -- \
            run --all \
            --dotnet dotnet \
            --output ./conversion-reports/

      - name: Post round-trip results to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- calor-roundtrip-verification -->';

            let body = `${marker}\n## Round-Trip Verification\n\n`;
            body += '| Project | Verdict | Baseline | Round-Trip | Regressions | Files Converted |\n';
            body += '|---------|---------|----------|------------|-------------|----------------|\n';

            const files = fs.readdirSync('conversion-reports')
              .filter(f => f.endsWith('-roundtrip.json'));

            for (const file of files) {
              const data = JSON.parse(fs.readFileSync(`conversion-reports/${file}`));
              const emoji = data.verdict === 'pass' ? ':white_check_mark:' :
                           data.verdict === 'minor_regressions' ? ':warning:' : ':x:';

              body += `| ${data.project} | ${emoji} ${data.verdict} | `;
              body += `${data.baseline?.passed ?? '—'}/${data.baseline?.total ?? '—'} | `;
              body += `${data.round_trip?.passed ?? '—'}/${data.round_trip?.total ?? '—'} | `;
              body += `**${data.regressions}** | `;
              body += `${data.files?.replaced}/${data.files?.total} |\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Upload round-trip reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-reports
          path: conversion-reports/*-roundtrip.*
          retention-days: 90

  id-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run ID validation tests
        run: dotnet test tests/Calor.Ids.Tests -c Release --verbosity normal

      # Truthful gate (#790, W1 Slice 4): no `|| true` / `|| echo` masking, and
      # the check targets directories that actually exist (`samples/`; the old
      # step scanned a nonexistent `examples/` and swallowed every failure).
      # Each sample directory is an independent program, so IDs are scoped
      # per-directory — cross-sample reuse of f001/m001 is legitimate.
      # Test-manifest honesty (#790, W1 Slice 4): every test tree is either
      # wired to CI or declared. Wired: all 11 sln projects (test job),
      # Calor.Ids.Tests (this job), Calor.RoundTrip.Harness.Tests (sln),
      # tests/E2E/agent-tasks (benchmark.yml + embedded self-test resources),
      # Calor.Performance.Tests (nightly performance.yml — wall-clock
      # assertions are load-sensitive). Declared non-gating: tests/
      # Calor.RoundTrip.Synthetic (harness CORPUS, exercised by the
      # roundtrip-verification job, not a test project to run directly);
      # tests/DebugRT (manual scratch console harness, not a test project).
      - name: Check IDs in samples
        run: |
          set -euo pipefail
          # Per-directory: each sample is an independent program, so IDs must be
          # unique within a sample but may repeat across samples. docs/ is NOT
          # ids-checked here — it contains no .calr files (ids check exits 1 on
          # an empty target by design) and its fenced calor blocks are already
          # drift-checked by `calor self-check docs` in the test job.
          for d in samples/*/; do
            echo "== ids check $d =="
            dotnet run -c Release --no-build --project src/Calor.Compiler -- ids check "$d" --allow-test-ids
          done

  sdk-package-consumer:
    # M-A1 SDK consumability (wedge plan v0.11 D-W1.2, PP-A1): a template
    # consumer project restores, builds, and tests green against the PACKAGED
    # Calor.Sdk from a local feed — never a source-tree ProjectReference.
    # Includes package-content inspection and the in-task Z3 verify canary.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run M-A1 consumer check (pack -> local feed -> restore/build/test)
        env:
          # download-z3.sh populates all supported RIDs on CI, so the packed
          # nupkg must carry every one of them.
          CALOR_SDK_REQUIRE_ALL_RIDS: "1"
        run: bash .github/scripts/test-sdk-package.sh

  verify-phase1:
    # Tier 1 self-verification harness — v6 §3.1.
    # Goal: every PR finishes Tier 1 in < 60s.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build (needed for ast_roundtrip)
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run Tier 1 (self-tests + identity checks)
        id: tier1_self
        run: |
          set -o pipefail
          /usr/bin/time -f '%e' -o tier1-self.time \
            python3 scripts/verify_phase1.py --self-test --skip-dotnet \
              2>&1 | tee tier1-self.log
          echo "elapsed_seconds=$(cat tier1-self.time)" >> "$GITHUB_OUTPUT"

      - name: Run Tier 1 (samples/ corpus)
        id: tier1_samples
        run: |
          set -o pipefail
          /usr/bin/time -f '%e' -o tier1-samples.time \
            python3 scripts/verify_phase1.py --skip-dotnet \
              2>&1 | tee tier1-samples.log
          echo "elapsed_seconds=$(cat tier1-samples.time)" >> "$GITHUB_OUTPUT"

      - name: Upload Tier 1 logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-verification
          path: |
            tier1-self.log
            tier1-self.time
            tier1-samples.log
            tier1-samples.time
          retention-days: 30

  phase1-corpus-clean:
    # Gate-A: ensure no legacy 26-char ULID structural blocks are
    # introduced into the corpus. Runs on every PR; budget < 5s.
    # Pairs with the scheduled tier4-monitor job, but blocks PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert zero legacy structural ULIDs in the corpus
        run: |
          python3 scripts/phase1_post_ship_monitor.py \
            --root . \
            --window 7 \
            --output phase1-corpus-clean.json \
            --fail-on-increase-over 0
          cat phase1-corpus-clean.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-corpus-clean
          path: phase1-corpus-clean.json
          retention-days: 14

  phase2-gate-dryrun:
    # Gate-D: exercise the Tier 3 gate plumbing without spending LLM
    # budget. Asserts the analyzer returns exit 0 for a "good" seed
    # and exit 1 for a "bad" seed.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analyzer deps
        run: pip install scipy

      - name: Run phase-2 gate dry-run smoke
        run: python3 scripts/smoke_phase_2_gate_dryrun.py

  vsix-single-file-publish:
    # The VSIX workflows pack the language server with PublishSingleFile=true.
    # They are the only release paths that build single-file, and single-file promotes
    # Assembly.Location uses to IL3000 errors under TreatWarningsAsErrors — so
    # v0.12.0's VS Code publish died on a compile error that no PR could have
    # caught. (That channel had in fact been failing since v0.4.0, unnoticed,
    # because nothing between releases ever ran this build.) One target is
    # enough; the analyzer verdict is RID-independent.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish language server single-file (same script the release uses)
        run: bash editors/vscode/scripts/build-server.sh linux-x64

      - name: Assert the server binary was produced
        run: |
          set -euo pipefail
          test -f editors/vscode/server/calor-lsp
          echo "single-file language server built: $(du -h editors/vscode/server/calor-lsp | cut -f1)"
