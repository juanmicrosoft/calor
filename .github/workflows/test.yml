name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # #1009 (audit R13): the roundtrip-verification job takes ~30 minutes running
  # `harness run --all` against MediatR/Serilog/FluentValidation. Docs-only PRs
  # cannot regress round-trip conversion, so we detect the change set here and
  # gate that one job on `has_non_docs_changes`. The filter is negative — it
  # matches any file OUTSIDE the docs paths — so if compiler code is ever
  # smuggled under `docs/` (or a new top-level directory appears), the job
  # still runs. Other jobs (`test`, `remaining-tests`, etc.) are NOT gated on
  # this and continue to run on docs-only PRs.
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_non_docs_changes: ${{ steps.filter.outputs.non_docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Detects whether the diff touches anything OTHER than docs.
          # dorny/paths-filter requires a positive anchor combined with
          # negative exclusions — the action's documented semantics are
          # that "a filter consisting of negated patterns only never
          # matches anything." The `- '**'` line is that anchor;
          # `predicate-quantifier: 'every'` then requires each matched
          # file to also survive every negative exclusion, so only
          # non-docs files count toward `non_docs=true`.
          #
          # On push events (main), paths-filter compares against the
          # previous commit; on pull_request, against the merge base.
          filters: |
            non_docs:
              - '**'
              - '!website/**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.mdx'
          predicate-quantifier: 'every'

  calor-first-guard:
    # Lifecycle hooks are useful guidance, but specialized Codex tool paths
    # can bypass them. This diff gate is the repository-level backstop.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Calor-first guard behavior
        run: bash scripts/check-calor-first-diff-tests.sh

      # §2.2 dogfood utility: its source must stay Calor-only and its generated
      # C# must stay untracked. Cheap and dependency-free, so it sits in the
      # guard job rather than waiting on a build.
      - name: Check the dogfood utility is Calor-only
        run: bash scripts/check-dogfood-utility.sh

      - name: Reject unapproved C# alongside Calor source
        env:
          CALOR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-calor-first-diff.sh

      - name: Test CI truth gates fail closed
        run: |
          python3 scripts/check_test_quality.py --self-test
          python3 scripts/check_trx.py --self-test

      - name: Check test manifest, skips, and assertion quality
        run: |
          python3 scripts/check_test_quality.py
          python3 scripts/generate_ast_infrastructure.py --check
          python3 scripts/sync-self-test-resources.py --check
          python3 scripts/test_supply_chain.py

      # #881 pinned reproduction: the epoch cost metric must count subagent
      # and compaction-segment output tokens. Pure Python, no build needed.
      - name: Test bench token-usage helper (#881)
        run: |
          python3 -m unittest discover -s bench/phase0-agent-native/tests
          bash bench/phase0-agent-native/tests/test_token_usage_fallback.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # #762 B2 (review Major 2): the F-2 conversion-leg ratchet
          # (BinderIncompleteRatchetTests.ConversionLeg_*) skips without the corpus
          # submodules — without this, leg 2's equality ratchet is enforced NOWHERE
          # in CI and a converter/binder regression moving its counts fails no pipeline.
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # src/Calor.Compiler/{z3,runtimes}/ are gitignored, so on a fresh checkout the
      # csproj's `<None Include="runtimes\**\*" CopyToOutputDirectory>` glob — resolved at
      # MSBuild EVALUATION time — matches nothing, and the natives never propagate to test
      # projects. The DownloadZ3 target populates those directories later, at EXECUTION
      # time, which is too late for the glob. The managed Microsoft.Z3.dll still flows via
      # <Reference Private="true">, so the wrapper loads and dies at P/Invoke, and every
      # Z3-backed test silently skips. Seeding before restore fixes the ordering.
      - name: Seed Z3 native libraries (before MSBuild evaluation)
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Capture tracked state before build
        run: git status --porcelain=v1 --untracked-files=all > /tmp/status-before

      - name: Build
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: dotnet build -c Release --no-restore

      - name: Run lossless formatter safety gate
        run: |
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~LosslessFormattingTests|FullyQualifiedName~ConvertFormatEnvelopeTests.Lint|FullyQualifiedName~Mcp.FormatToolTests" \
            --verbosity normal
          dotnet test tests/Calor.LanguageServer.Tests/Calor.LanguageServer.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~FormattingHandlerTests" \
            --verbosity normal

      - name: Run exact-span LSP refactoring gate
        run: >-
          dotnet test tests/Calor.LanguageServer.Tests/Calor.LanguageServer.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~ExactSpanRefactoringGateTests|FullyQualifiedName~RenameHandlerTests"
          --verbosity normal

      - name: Run full-vs-incremental identity gate
        run: >-
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~EditScriptIdentityTests"
          --verbosity normal

      - name: Run corpus binder ratchet and higher-order demand ledger (D-B leg)
        run: |
          set -euo pipefail
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~BinderIncompleteRatchetTests.ConversionLeg_IncompleteCount_MatchesBaseline|FullyQualifiedName~HigherOrderDemandLedgerTests.DB_CSharpBackstop_MatchesLedgerExactly" \
            --verbosity normal 2>&1 | tee /tmp/binder-ratchet.log
          if grep -q "corpus submodules not initialized" /tmp/binder-ratchet.log; then
            echo "::error::Corpus-gated ratchet (binder ratchet or demand ledger D-B) skipped despite recursive checkout."
            exit 1
          fi

      # §2.2 dogfood utility: built from .calr through Calor.Sdk and then RUN,
      # against this repository's own allowlist. Building it proves the SDK path
      # works; running it is what makes the repo actually depend on a Calor
      # program — it exits non-zero when the allowlist has drifted.
      - name: Build and run the dogfood utility (Calor source, Calor.Sdk)
        run: |
          set -euo pipefail
          dotnet build tools/calor-allowlist-audit/CalorAllowlistAudit.csproj \
            -c Release --no-restore
          dotnet tools/calor-allowlist-audit/bin/Release/net10.0/calor-allowlist-audit.dll

      - name: Run index/query correctness gate
        run: >-
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~QueryGoldenTests|FullyQualifiedName~ProjectIndexTests"
          --verbosity normal

      - name: Run rename gate
        run: >-
          dotnet test tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~RenameHarnessTests"
          --verbosity normal

      # F-4 / #779: generated solver-vs-runtime differential. This blocking Fact
      # fails rather than skips when Z3 is unavailable. It verifies the frozen
      # modeled-form denominator across §Q, §S and §PROOF, depths 1..3 and both
      # polarities, executes guard-forced generated C#, and byte-checks reports.
      - name: Run verifier-runtime differential gate
        run: >-
          dotnet test tests/Calor.Verification.Tests/Calor.Verification.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~VerifierRuntimeDifferentialTests.CommittedReportsMatchGeneratedOracle"
          --verbosity normal

      - name: Upload verifier-runtime differential metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-runtime-differential
          path: |
            bench/phase0-agent-native/verifier-runtime-differential.json
            bench/phase0-agent-native/verifier-runtime-differential.md
          retention-days: 30

      # Spec drift (Phase 1 item 6, agent-native strategy): agent-facing docs
      # are machine-checked against the implementation, reusing this job's
      # build. Covered files: CLAUDE.md, .github/copilot-instructions.md, every
      # docs/syntax-reference/*.md, and every docs/cli/*.md (plus docs/**/*.md
      # for the version scan). Checks:
      # documented §-keywords exist in the lexer, cited CalorNNNN codes exist
      # (and cited bands are non-empty), the effect table in
      # docs/syntax-reference/effects.md matches the effect registry in both
      # directions, the Calor13xx table in docs/cli/structured-output.md is
      # complete, no doc hardcodes the current version, and every fenced
      # ```calor example declaring a complete program (starts with §M) still
      # parses with the current compiler.
      - name: Check agent-facing docs against the implementation (spec drift)
        run: dotnet run --project src/Calor.Compiler -c Release --no-build -- self-check docs

      - name: Pack offline and assert tracked worktree is unchanged
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          dotnet pack src/Calor.Compiler/Calor.Compiler.csproj \
            -c Release --no-build --no-restore -o /tmp/calor-hermetic-pack
          git status --porcelain=v1 --untracked-files=all > /tmp/status-after
          diff -u /tmp/status-before /tmp/status-after

      - name: Missing Z3 fails before compilation without downloading
        run: |
          set -euo pipefail
          mv src/Calor.Compiler/z3 /tmp/calor-z3
          mv src/Calor.Compiler/runtimes /tmp/calor-runtimes
          trap 'mv /tmp/calor-z3 src/Calor.Compiler/z3; mv /tmp/calor-runtimes src/Calor.Compiler/runtimes' EXIT
          if dotnet build src/Calor.Compiler/Calor.Compiler.csproj \
              -c Release --no-restore -t:Rebuild > /tmp/missing-z3.log 2>&1; then
            echo "::error::build unexpectedly succeeded without Z3 assets"
            exit 1
          fi
          grep -F "missing Z3 asset" /tmp/missing-z3.log
          test ! -e src/Calor.Compiler/z3
          test ! -e src/Calor.Compiler/runtimes

      - name: Dependency lock mismatch fails closed
        run: |
          set -euo pipefail
          cp Directory.Packages.props /tmp/Directory.Packages.props
          trap 'cp /tmp/Directory.Packages.props Directory.Packages.props' EXIT
          sed -i 's/Ulid" Version="1.3.4"/Ulid" Version="1.3.3"/' Directory.Packages.props
          if dotnet restore src/Calor.Compiler/Calor.Compiler.csproj --locked-mode; then
            echo "::error::locked restore unexpectedly accepted a package-version mismatch"
            exit 1
          fi

  quality-ratchets:
    runs-on: ubuntu-latest
    # 2026-09-02: was 20, and this job runs 17.8-19.9 min (13 consecutive
    # successful runs sampled). It had no headroom at all, so a run that drifted
    # a little long was cancelled BY ITS OWN TIMEOUT and reported as an
    # infrastructure kill — the "all steps success, job cancelled" shape on
    # #1151 and the cancelled LSP flake gate on #1155. A job cancelled this way
    # SIGTERMs its children, so `dotnet test` under it exits 143, which is also
    # part of what #1150 has been chasing. 35 is ~75% headroom over the observed
    # maximum; the gates themselves are unchanged.
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Seed Z3 native libraries
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore and build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Test coverage, mutation, and performance ratchets fail closed
        run: |
          python3 scripts/check_coverage.py --self-test
          python3 scripts/check_trx.py --self-test
          python3 scripts/run_mutation_gate.py --self-test
          python3 scripts/run_performance_gate.py --self-test
          python3 scripts/run_flake_gate.py --self-test
          # #1150: the sampler runs on Linux but is edited on macOS, where its
          # Linux branch never executes. Without this, a typo in the awk ships as
          # a probe that runs and records nothing — the exact silent-instrument
          # failure this issue is about.
          bash scripts/runner-resource-sampler.sh --self-test

      - name: Collect component coverage
        run: |
          set -euo pipefail
          # #1150: same streaming sampler as the compiler shard. This step is the
          # other place the SIGTERM lands, and the post-hoc probe below could
          # never have caught it — see the correction on that step.
          bash scripts/runner-resource-sampler.sh 10 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          for project in \
            Calor.Compiler.Tests \
            Calor.Conversion.Tests \
            Calor.Enforcement.Tests \
            Calor.Semantics.Tests \
            Calor.Verification.Tests
          do
            dotnet test "tests/$project/$project.csproj" \
              -c Release --no-build --no-restore \
              --collect:"XPlat Code Coverage" \
              --logger "trx;LogFileName=$project.trx" \
              --results-directory "artifacts/coverage/raw/$project" \
              --verbosity quiet
          done

      # #1150, 2026-09-02. The probe added in #1153 went on the `tests` matrix
      # job only, and the kill that keeps costing re-runs is HERE: "Collect
      # component coverage" takes SIGTERM (exit 143) part-way through
      # Calor.Compiler.Tests, with no output between "A total of 1 test files
      # matched" and the kill. Observed on #1152 (a docs-only PR, so not a
      # compiler regression) and again on #1155 attempt 2, while the SAME commit
      # passed on two earlier runs — intermittent, and undiagnosable without a
      # reading taken at the moment of death.
      #
      # CORRECTED 2026-09-03 (v0.18 M2): `if: always()` cannot take that reading.
      # A shutdown signal stops the runner, so no later step executes — verified
      # on run 33687411104, where the sibling probe produced no output at all.
      # This step is retained as a post-mortem for ORDINARY failures; the kill is
      # observed by the streaming sampler started inside the step above.
      - name: Runner resource probe (#1150)
        if: always()
        run: |
          echo "--- disk ---"; df -h / /home/runner 2>/dev/null || df -h
          echo "--- memory ---"; free -m 2>/dev/null || vm_stat
          echo "--- largest processes ---"; ps -o pid,rss,comm -A 2>/dev/null | sort -k2 -rn | head -12

      - name: Enforce component coverage ratchets
        run: python3 scripts/check_coverage.py

      - name: Run deterministic mutation gate
        run: python3 scripts/run_mutation_gate.py

      - name: Run live LSP flake gate
        run: python3 scripts/run_flake_gate.py --runs 10

      - name: Upload test, coverage, mutation, and flake reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-ratchet-reports
          path: |
            artifacts/coverage/
            artifacts/mutation/
            artifacts/flake/
          retention-days: 90

  remaining-tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler
            project: tests/Calor.Compiler.Tests/Calor.Compiler.Tests.csproj
          - name: conversion
            project: tests/Calor.Conversion.Tests/Calor.Conversion.Tests.csproj
          - name: enforcement
            project: tests/Calor.Enforcement.Tests/Calor.Enforcement.Tests.csproj
          - name: evaluation
            project: tests/Calor.Evaluation/Calor.Evaluation.csproj
          - name: experimental
            project: tests/Calor.Experimental.Tests/Calor.Experimental.Tests.csproj
          - name: il-analysis
            project: tests/Calor.ILAnalysis.Tests/Calor.ILAnalysis.Tests.csproj
          - name: language-server
            project: tests/Calor.LanguageServer.Tests/Calor.LanguageServer.Tests.csproj
          - name: roundtrip-harness
            project: tests/Calor.RoundTrip.Harness.Tests/Calor.RoundTrip.Harness.Tests.csproj
          - name: semantics
            project: tests/Calor.Semantics.Tests/Calor.Semantics.Tests.csproj
          - name: tasks
            project: tests/Calor.Tasks.Tests/Calor.Tasks.Tests.csproj
          - name: verification
            project: tests/Calor.Verification.Tests/Calor.Verification.Tests.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.name == 'compiler' && 'recursive' || 'false' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Seed before MSBuild evaluation so any Z3-backed project receives its
      # native runtime asset instead of silently skipping verification tests.
      - name: Seed Z3 native libraries
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Run project tests
        run: |
          set -euo pipefail
          # #1150: stream resource readings INTO THIS STEP'S LOG. The post-hoc
          # probe below cannot observe a runner shutdown — verified on run
          # 33687411104, a kill that happened AFTER that probe landed, whose log
          # contains no probe output at all. A step cannot run once the runner
          # service is stopping, so `if: always()` buys nothing here. Streamed
          # samples survive, because the log is captured up to the instant of
          # death. Its own stdout, deliberately not through `tee`, so
          # test-output.log stays clean for the Z3 grep below.
          bash scripts/runner-resource-sampler.sh 10 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          dotnet test "${{ matrix.project }}" -c Release \
            --logger "trx;LogFileName=${{ matrix.name }}.trx" \
            --results-directory artifacts/test \
            --verbosity normal 2>&1 | tee test-output.log
          if grep -q "Z3 not available" test-output.log; then
            echo "::error::Z3-gated tests skipped — natives did not reach this test host."
            grep -c "Z3 not available" test-output.log
            exit 1
          fi

      # Issue #1150: this shard has been SIGTERM'd seven times in two days
      # ("The runner has received a shutdown signal", exit 143) with ZERO test
      # failures in every log. Three hypotheses were advanced and all three
      # discarded by evidence — per-job memory pressure (it also hit
      # release-quality), an Actions quota (the repo is public, so standard
      # runners are free), and a platform incident (the status feed shows none).
      # Guessing has cost more than measuring would. `df` and `free` before and
      # after the run cost ~1 s and settle the resource question directly: if the
      # disk is near full or memory is exhausted at the point of death, the next
      # kill's log says so.
      #
      # CORRECTED 2026-09-03 (v0.18 M2): `if: always()` does NOT run when the
      # runner is shut down — checked on run 33687411104, where this probe
      # emitted nothing. It is kept for ORDINARY failures, where it still reports
      # a useful post-mortem; the instrument that actually observes a kill is the
      # streaming sampler started inside the test step above.
      - name: Runner resource probe (#1150)
        if: always()
        run: |
          echo "--- disk ---"; df -h / /home/runner 2>/dev/null || df -h
          echo "--- memory ---"; free -m 2>/dev/null || vm_stat
          echo "--- dotnet build servers ---"; ps -o pid,rss,comm -A 2>/dev/null | sort -k2 -rn | head -12

      - name: Enforce test inventory
        run: >-
          python3 scripts/check_trx.py
          --trx "artifacts/test/${{ matrix.name }}.trx"
          --project "${{ matrix.project }}"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.name }}
          path: artifacts/test/
          retention-days: 30

  ds15-fixtures:
    # PP-S4's instrument (A-1.5.7; roadmap v0.13 §2.5 gate 6): every SupportLevel
    # promotion toward Full and every net ConversionLossKind removal must carry a
    # registered fixture. The script's --self-test runs FIRST on every invocation,
    # so the gate is demonstrated to fail on a fixture-less promotion continuously,
    # not once (the discriminating pin, per pins-must-discriminate).
    # Job ID cannot contain dots (GitHub Actions rejects the whole workflow file);
    # the display name below carries the A-1.5.7 frozen entry-point name and is what
    # status contexts show.
    name: d-s1.5-fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test (discriminating pin)
        run: bash scripts/check-d-s1.5-fixtures.sh --self-test

      - name: Check promotions and loss-kind removals against the registry
        env:
          CALOR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="${CALOR_BASE_SHA:-}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          # merge-base: the precise span for PR events (payload base.sha is the base
          # branch at PR creation and can span unrelated main commits).
          BASE=$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")
          bash scripts/check-d-s1.5-fixtures.sh "$BASE" HEAD

      - name: Detect registered fixtures
        id: fixtures
        run: |
          if ls bench/phase0-agent-native/fixtures/d-s1.5/*/fixture.json >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.fixtures.outputs.present == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        if: steps.fixtures.outputs.present == 'true'
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Validate registered fixtures (indeterminate = failing)
        if: steps.fixtures.outputs.present == 'true'
        run: |
          dotnet test tests/Calor.Conversion.Tests -c Release \
            --filter "FullyQualifiedName~DS15FixtureRegistry" --verbosity detailed

  conversion-scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run scorecard tests
        run: >-
          dotnet test tests/Calor.Evaluation/Calor.Evaluation.csproj -c Release --no-build
          --filter "FullyQualifiedName~ConversionScorecardTests"
          --verbosity normal

      - name: Generate scorecard report
        run: >-
          dotnet run --project tests/Calor.Evaluation -c Release --
          scorecard --format both -o conversion-scorecard

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-scorecard
          path: |
            conversion-scorecard.json
            conversion-scorecard.md

      - name: Post PR comment with scorecard
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('conversion-scorecard.md', 'utf8');
            const marker = '<!-- calor-conversion-scorecard -->';
            const body = `${marker}\n${md}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Check for regressions against baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const current = JSON.parse(fs.readFileSync('conversion-scorecard.json', 'utf8'));

            const baselinePath = 'tests/Calor.Evaluation/Scorecard/baseline.json';
            let baselineJson;
            if (context.eventName === 'pull_request') {
              const baseSha = context.payload.pull_request.base.sha;
              baselineJson = execFileSync(
                'git',
                ['show', `${baseSha}:${baselinePath}`],
                { encoding: 'utf8' });
              core.info(`Comparing against baseline from PR base ${baseSha}`);
            } else {
              if (!fs.existsSync(baselinePath)) {
                core.setFailed(`Committed scorecard baseline is missing: ${baselinePath}`);
                return;
              }
              baselineJson = fs.readFileSync(baselinePath, 'utf8');
            }
            const baseline = JSON.parse(baselineJson);

            // Compare round-trip counts
            const baselineRt = baseline.roundTripPassing;
            const currentRt = current.roundTripPassing;
            const delta = currentRt - baselineRt;

            core.info(`Baseline round-trip: ${baselineRt}/${baseline.total}`);
            core.info(`Current round-trip:  ${currentRt}/${current.total}`);
            core.info(`Delta: ${delta >= 0 ? '+' : ''}${delta}`);

            // Detect per-snippet regressions
            const currentById = {};
            for (const r of current.results) currentById[r.id] = r;

            const regressions = [];
            const statusRank = {
              Crashed: 0,
              Blocked: 1,
              PartiallyConverted: 2,
              FullyConverted: 3,
            };
            const addedMultisetEntries = (baselineEntries, currentEntries) => {
              const remaining = new Map();
              for (const entry of baselineEntries) {
                remaining.set(
                  entry,
                  (remaining.get(entry) ?? 0) + 1);
              }
              const added = [];
              for (const entry of currentEntries) {
                const count = remaining.get(entry) ?? 0;
                if (count === 0) {
                  added.push(entry);
                } else {
                  remaining.set(entry, count - 1);
                }
              }
              return added;
            };
            const legacyInteropIdentity = issue => {
              const feature =
                issue.match(/\[([^\]]+)\]/)?.[1] ?? 'unknown';
              const line =
                issue.match(/\(line (\d+)/)?.[1] ?? 'unknown';
              return `InteropPreserved|${feature}|${line}`;
            };
            const structuredInteropIdentity = diagnostic => {
              const brackets =
                [...diagnostic.matchAll(/\[([^\]]+)\]/g)]
                  .map(match => match[1]);
              const kind = brackets[0] ?? 'unknown';
              const feature =
                brackets[brackets.length - 1] ?? 'unknown';
              const line =
                diagnostic.match(/:(\d+) \[/)?.[1] ?? 'unknown';
              return `${kind}|${feature}|${line}`;
            };
            for (const b of baseline.results) {
              const r = currentById[b.id];
              if (!r) {
                regressions.push(b.id);
                continue;
              }
              const bPass = b.conversionSuccess &&
                b.compilationSuccess &&
                b.cSharpCompilationSuccess &&
                (b.semanticLossCount ?? 0) === 0;
              const cPass = r.conversionSuccess &&
                r.compilationSuccess &&
                r.cSharpCompilationSuccess &&
                (r.semanticLossCount ?? 0) === 0;
              const legacyInfoInterop = (b.conversionIssues ?? []).filter(
                issue => issue.startsWith('Info ') &&
                  issue.includes('interop block preserved'));
              const legacyAnyInterop = (b.conversionIssues ?? []).filter(
                issue => issue.includes('interop block preserved') ||
                  issue.includes('§CSHARP interop preservation'));
              const baselineInteropCount =
                b.interopPreservationCount ??
                (legacyInfoInterop.length > 0
                  ? legacyInfoInterop.length
                  : legacyAnyInterop.length);
              const currentInteropCount =
                r.interopPreservationCount ?? 0;
              const baselineDiagnostics =
                b.interopPreservationDiagnostics ?? [];
              const currentDiagnostics =
                r.interopPreservationDiagnostics ?? [];
              const currentLossFieldsValid =
                Number.isInteger(r.interopPreservationCount) &&
                r.interopPreservationCount >= 0 &&
                Array.isArray(r.interopPreservationDiagnostics) &&
                Number.isInteger(r.semanticLossCount) &&
                r.semanticLossCount >= 0 &&
                Array.isArray(r.semanticLossDiagnostics);
              const baselineInteropIdentities =
                baselineDiagnostics.length > 0
                  ? baselineDiagnostics
                  : (legacyInfoInterop.length > 0
                      ? legacyInfoInterop
                      : legacyAnyInterop)
                    .map(legacyInteropIdentity);
              const currentInteropIdentities =
                baselineDiagnostics.length > 0
                  ? currentDiagnostics
                  : currentDiagnostics
                    .map(structuredInteropIdentity);
              const interopDiagnosticsConsistent =
                currentDiagnostics.length === currentInteropCount &&
                (baselineDiagnostics.length === 0 ||
                 baselineDiagnostics.length === baselineInteropCount);
              const addedInteropDiagnostics = addedMultisetEntries(
                baselineInteropIdentities,
                currentInteropIdentities);
              const addedInterop =
                currentInteropCount > baselineInteropCount ||
                !interopDiagnosticsConsistent ||
                addedInteropDiagnostics.length > 0;
              const baselineSemanticCount =
                b.semanticLossCount ?? 0;
              const currentSemanticCount =
                r.semanticLossCount ?? 0;
              const baselineSemanticDiagnostics =
                b.semanticLossDiagnostics ?? [];
              const currentSemanticDiagnostics =
                r.semanticLossDiagnostics ?? [];
              const addedSemanticLoss =
                currentSemanticCount > baselineSemanticCount ||
                currentSemanticDiagnostics.length
                  !== currentSemanticCount ||
                (baselineSemanticDiagnostics.length > 0 &&
                 addedMultisetEntries(
                   baselineSemanticDiagnostics,
                   currentSemanticDiagnostics).length > 0);
              const lostSuccessfulStage =
                (b.conversionSuccess === true &&
                 r.conversionSuccess !== true) ||
                (b.compilationSuccess === true &&
                 r.compilationSuccess !== true) ||
                (b.cSharpSyntaxSuccess === true &&
                 r.cSharpSyntaxSuccess !== true) ||
                (b.cSharpCompilationSuccess === true &&
                 r.cSharpCompilationSuccess !== true);
              const honestInteropReclassification =
                b.status === 'FullyConverted' &&
                r.status === 'PartiallyConverted' &&
                bPass &&
                cPass &&
                baselineInteropCount > 0 &&
                currentInteropCount === baselineInteropCount &&
                !addedInterop;
              if ((statusRank[r.status] < statusRank[b.status] &&
                   !honestInteropReclassification) ||
                  (bPass && !cPass) ||
                  addedInterop ||
                  addedSemanticLoss ||
                  lostSuccessfulStage ||
                  !currentLossFieldsValid) {
                regressions.push(b.id);
              }
            }

            if (regressions.length > 0) {
              core.setFailed(`Conversion regressions detected in snippets: ${regressions.join(', ')}`);
            } else if (currentRt < baselineRt) {
              core.setFailed(`Round-trip count dropped: ${baselineRt} → ${currentRt}`);
            } else {
              core.info('No regressions detected');
            }

  roundtrip-verification:
    # #1009 (audit R13): skip the ~30-minute round-trip harness on docs-only
    # PRs. `detect-changes` sets `has_non_docs_changes=false` when the diff
    # touches only website/, docs/, or root markdown. GitHub still surfaces
    # skipped jobs on the PR check list, so the skip is visible, not silent.
    #
    # Gate semantics: `!= 'false'` (not `== 'true'`) fails SAFE. If
    # `detect-changes` itself fails (network glitch, checkout error, etc.),
    # its output is empty — `!= 'false'` is true, so the round-trip job
    # runs anyway. We'd rather burn 30 min unnecessarily than silently drop
    # a signal because a 30-second precheck failed.
    #
    # The `always()` clause is preserved so the job runs even if
    # `conversion-scorecard` fails — but only when there are non-docs
    # changes and the precheck did not explicitly veto.
    if: >-
      always() &&
      needs.detect-changes.outputs.has_non_docs_changes != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-changes, conversion-scorecard]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # The corpus (MediatR/Serilog/FluentValidation) is vendored as SHA-pinned git
      # submodules under bench/corpus/ (D-W4.2). This job needs them, so it checks out
      # with submodules — the MAIN build/test jobs above do NOT (the corpus is
      # benchmark infra, not a build dependency; the Calor solution builds and tests
      # without it).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10 (for Calor build + net10 corpus targets)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 8 (MediatR/FluentValidation tests run on net8.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # PRECAUTIONARY, not currently load-bearing — stated honestly because an earlier
      # version of this comment was wrong. This job runs `harness run --all`, which routes
      # to RoundTripPipeline and touches no Z3; the Z3-backed addressability probe
      # (VerificationAddressability) is reachable only from the `gen-tasks` command, and its
      # tests run in the `test` job. Verified: with and without this step the job's output is
      # byte-identical. Kept so that adding `gen-tasks` here cannot silently degrade.
      - name: Seed Z3 native libraries (before MSBuild evaluation)
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore and build Calor
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run round-trip verification
        run: |
          dotnet run --project tools/Calor.RoundTrip.Harness/ -c Release -- \
            run --all \
            --dotnet dotnet \
            --output ./conversion-reports/

      - name: Post round-trip results to PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- calor-roundtrip-verification -->';

            let body = `${marker}\n## Round-Trip Verification\n\n`;
            body += '| Project | Verdict | Tests | Inventory Δ | Native | Total coverage | Interop | Gaps |\n';
            body += '|---------|---------|-------|-------------|--------|----------------|---------|------|\n';

            const reportsDir = 'conversion-reports';
            const files = fs.existsSync(reportsDir)
              ? fs.readdirSync(reportsDir).filter(f => f.endsWith('-roundtrip.json'))
              : [];

            if (files.length === 0) {
              body += ':x: The round-trip job produced no JSON reports. Check the failed workflow logs.\n';
            }

            for (const file of files) {
              const data = JSON.parse(fs.readFileSync(`${reportsDir}/${file}`));
              const emoji = data.verdict === 'pass' ? ':white_check_mark:' : ':x:';
              const fidelity = data.fidelity;

              body += `| ${data.project} | ${emoji} ${data.verdict} | `;
              body += `${data.round_trip?.passed ?? '—'}/${data.round_trip?.total ?? '—'} | `;
              body += `${fidelity?.tests?.inventory_delta ?? '—'} | `;
              body += `${fidelity ? (100 * fidelity.coverage.native_fraction).toFixed(1) + '%' : '—'} | `;
              body += `${fidelity ? (100 * fidelity.coverage.coverage_fraction).toFixed(1) + '%' : '—'} | `;
              body += `${fidelity?.coverage?.total_interop_blocks ?? '—'} | `;
              body += `${fidelity?.coverage?.distinct_gaps?.length ?? '—'} |\n`;
              if (data.gate_failures?.length) {
                body += `\n**${data.project} blockers:** ${data.gate_failures.join('; ')}\n\n`;
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # Warning-only incremental delta alarm (#1005). Compares the current
      # per-project round-trip pass counts to the committed baseline in
      # eng/roundtrip-baselines.json. If ANY project lost ground, posts a PR
      # comment (marker `<!-- calor-roundtrip-delta -->`). Never fails the job —
      # the absolute-threshold gate (RoundTripExitPolicy) remains authoritative
      # for merge-blocking. This surfaces drifts the absolute gate does not
      # catch (see the MediatR MinorRegressions signal on PRs #986 / #992 that
      # a maintainer had to interpret manually).
      - name: Self-test round-trip delta script
        # Verifies the delta-computation logic itself before running it
        # against real reports. Matches the pattern used by check_coverage.py,
        # check_trx.py, and run_mutation_gate.py at earlier CI steps.
        if: always()
        run: python3 scripts/roundtrip_delta.py --self-test

      - name: Compute round-trip delta vs baseline
        # Never fails the job — the absolute-threshold gate
        # (RoundTripExitPolicy) remains authoritative for merge-blocking.
        # Belt-and-suspenders: continue-on-error at the step level +
        # explicit `has_delta=false` fallback on ANY script error so a
        # silent skip is impossible. If the script crashes (missing
        # baseline, malformed JSON, git surprise), the step still emits
        # `has_delta=false` and the workflow continues.
        if: always()
        id: rt_delta
        continue-on-error: true
        run: |
          set +e
          python3 scripts/roundtrip_delta.py \
            --baseline eng/roundtrip-baselines.json \
            --reports conversion-reports/ \
            --output-markdown conversion-reports/_delta.md
          script_exit=$?
          if [ "$script_exit" -ne 0 ]; then
            echo "roundtrip_delta.py exited $script_exit — skipping delta comment"
            echo "has_delta=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -s conversion-reports/_delta.md ]; then
            echo "has_delta=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_delta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post round-trip delta warning to PR
        if: >-
          always() &&
          steps.rt_delta.outputs.has_delta == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- calor-roundtrip-delta -->';
            const body = fs.readFileSync('conversion-reports/_delta.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Upload round-trip reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-reports
          path: conversion-reports/*-roundtrip.*
          retention-days: 90

  id-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run ID validation tests
        run: >-
          dotnet test tests/Calor.Ids.Tests/Calor.Ids.Tests.csproj -c Release
          --logger "trx;LogFileName=ids.trx"
          --results-directory artifacts/test
          --verbosity normal

      - name: Enforce ID test inventory
        run: >-
          python3 scripts/check_trx.py
          --trx artifacts/test/ids.trx
          --project tests/Calor.Ids.Tests/Calor.Ids.Tests.csproj

      - name: Test sample ID gate fails closed
        run: bash scripts/check_sample_ids.sh --self-test

      - name: Check IDs in samples
        run: bash scripts/check_sample_ids.sh

  sdk-package-consumer:
    # M-A1 SDK consumability (wedge plan v0.11 D-W1.2, PP-A1): a template
    # consumer project restores, builds, and tests green against the PACKAGED
    # Calor.Sdk from a local feed — never a source-tree ProjectReference.
    # Includes package-content inspection and the in-task Z3 verify canary.
    name: sdk-package-consumer (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-14
            rid: osx-arm64
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        if: runner.os != 'Windows'
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Bootstrap verified Z3 assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File src/Calor.Compiler/scripts/download-z3.ps1

      - name: Run M-A1 consumer check (pack -> local feed -> restore/build/test)
        env:
          # The explicit bootstrap populates all supported RIDs before MSBuild
          # evaluates the package closure.
          CALOR_SDK_REQUIRE_ALL_RIDS: "1"
          CALOR_SDK_EXPECTED_RID: ${{ matrix.rid }}
        run: bash .github/scripts/test-sdk-package.sh

  cli-tool-consumer:
    # Roadmap §2.5 gate 7 — clean-consumer install, CLI leg (#790). The Sdk leg
    # is sdk-package-consumer above; this is the `calor` global tool, which was
    # previously only ever checked by hand after a publish.
    #
    # The matrix is gate 7's frozen RID set (win-x64, linux-x64, osx-arm64). The
    # dropped osx-x64 RID (#916) is not a runner here — its amended oracle, the
    # documented degradation, is reproduced inside the script on every leg.
    name: cli-tool-consumer (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-14
            rid: osx-arm64
          - runner: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.runner }}
    # Windows packs, restores from a cold NuGet cache and installs a global tool
    # noticeably slower than the POSIX legs; 20 minutes was tight enough that a
    # slow runner would read as a gate failure (review round 2).
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        if: runner.os != 'Windows'
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Bootstrap verified Z3 assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File src/Calor.Compiler/scripts/download-z3.ps1

      - name: Run gate 7 CLI consumer check (pack -> tool install -> solver verdict)
        env:
          CALOR_EXPECTED_RID: ${{ matrix.rid }}
        run: bash .github/scripts/test-cli-tool-consumer.sh

  verify-phase1:
    # Tier 1 self-verification harness — v6 §3.1.
    # Goal: every PR finishes Tier 1 in < 60s.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap verified Z3 assets
        run: bash src/Calor.Compiler/scripts/download-z3.sh

      - name: Restore and build (needed for ast_roundtrip)
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run Tier 1 (self-tests + identity checks)
        id: tier1_self
        run: |
          set -o pipefail
          /usr/bin/time -f '%e' -o tier1-self.time \
            python3 scripts/verify_phase1.py --self-test --skip-dotnet \
              2>&1 | tee tier1-self.log
          echo "elapsed_seconds=$(cat tier1-self.time)" >> "$GITHUB_OUTPUT"

      - name: Run Tier 1 (samples/ corpus)
        id: tier1_samples
        run: |
          set -o pipefail
          /usr/bin/time -f '%e' -o tier1-samples.time \
            python3 scripts/verify_phase1.py --skip-dotnet \
              2>&1 | tee tier1-samples.log
          echo "elapsed_seconds=$(cat tier1-samples.time)" >> "$GITHUB_OUTPUT"

      - name: Upload Tier 1 logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-verification
          path: |
            tier1-self.log
            tier1-self.time
            tier1-samples.log
            tier1-samples.time
          retention-days: 30

  phase1-corpus-clean:
    # Gate-A: ensure no legacy 26-char ULID structural blocks are
    # introduced into the corpus. Runs on every PR; budget < 5s.
    # Pairs with the scheduled tier4-monitor job, but blocks PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert zero legacy structural ULIDs in the corpus
        run: |
          python3 scripts/phase1_post_ship_monitor.py \
            --root . \
            --window 7 \
            --output phase1-corpus-clean.json \
            --fail-on-increase-over 0
          cat phase1-corpus-clean.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-corpus-clean
          path: phase1-corpus-clean.json
          retention-days: 14

  phase2-gate-dryrun:
    # Gate-D: exercise the Tier 3 gate plumbing without spending LLM
    # budget. Asserts the analyzer returns exit 0 for a "good" seed
    # and exit 1 for a "bad" seed.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analyzer deps
        run: pip install scipy

      - name: Run phase-2 gate dry-run smoke
        run: python3 scripts/smoke_phase_2_gate_dryrun.py

  snapshot-diff-heuristic:
    # Soft warning gate: scan .approved.calr snapshot diffs for
    # suspicious drops (comments, §CSHARP interop blocks/bytes) that
    # a bulk CALOR_UPDATE_SNAPSHOTS=1 refresh might silently produce.
    # NEVER fails the job — posts a PR comment when signals fire.
    # Refs #999 (audit finding F5 / recommendation R3).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Self-test the heuristic
        run: python3 scripts/check_snapshot_diffs.py --self-test

      - name: Scan snapshot diffs
        # The script guarantees exit code 0 even on internal error
        # (see try/except in main()); continue-on-error is
        # belt-and-suspenders so a shell-level surprise (missing python,
        # OOM, etc.) still cannot fail the job.
        continue-on-error: true
        run: |
          python3 scripts/check_snapshot_diffs.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            > /tmp/snapshot-warnings.md || true

      - name: Post PR comment when signals fire
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/snapshot-warnings.md';
            if (!fs.existsSync(path)) {
              core.info('No snapshot-warnings.md produced.');
              return;
            }
            const md = fs.readFileSync(path, 'utf8').trim();
            if (!md) {
              core.info('No suspicious snapshot diffs detected.');
              return;
            }
            const marker = '<!-- calor-snapshot-diff-heuristic -->';
            const body = md.startsWith(marker) ? md : `${marker}\n${md}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
