name: Website regressions

on:
  pull_request:
    branches: [main, release/v0.19]
    paths: ['website/**', '.github/workflows/website-tests.yml']
  push:
    branches: [release/v0.19]
    paths: ['website/**', '.github/workflows/website-tests.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base-path: ['', '/calor']
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.base-path }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces-${{ strategy.job-index }}
          path: website/test-results/
